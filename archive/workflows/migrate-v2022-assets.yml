name: One-time v2.0.22 local asset migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/migrate-v2022-assets.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3BMXpheeptMzHvfe5a79t42NvXk/2eca328d-55b1-408c-bfeb-b8ef4315bc4f.zip
      PACKAGE_SHA256: cb585f300397c141d7e4ebb2c966eb57ee0c657ae31966082ce029f20c498241
    steps:
      - name: Migrate v2.0.21 package to local assets and publish v2.0.22
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          curl -fL "$PACKAGE_URL" -o /tmp/scl-v2021.zip
          echo "$PACKAGE_SHA256  /tmp/scl-v2021.zip" | sha256sum -c -
          rm -rf /tmp/scl-v2021
          mkdir -p /tmp/scl-v2021
          unzip -q /tmp/scl-v2021.zip -d /tmp/scl-v2021
          SRC="$(find /tmp/scl-v2021 -type f -name index.html -printf '%h\n' | head -n1)"
          test -n "$SRC"
          for f in index.html 404.html service-worker.js version.json CHANGELOG.md; do
            test -f "$SRC/$f"
            cp "$SRC/$f" "$f"
          done

          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, re
          root=Path('.')
          out=root/'assets'/'embedded'
          out.mkdir(parents=True,exist_ok=True)
          pat=re.compile(r'data:image/([A-Za-z0-9.+-]+);base64,([A-Za-z0-9+/=]+)')
          extmap={'jpeg':'jpg','jpg':'jpg','png':'png','webp':'webp','gif':'gif','svg+xml':'svg','avif':'avif'}
          def localize(text):
              def repl(m):
                  raw=base64.b64decode(m.group(2)); mime=m.group(1).lower()
                  digest=hashlib.sha256(raw).hexdigest(); ext=extmap.get(mime,'bin')
                  rel=f'assets/embedded/{digest[:20]}.{ext}'
                  p=root/rel
                  if not p.exists(): p.write_bytes(raw)
                  return rel
              return pat.sub(repl,text)
          for name in ('index.html','404.html'):
              p=root/name
              text=localize(p.read_text(encoding='utf-8')).replace('2.0.21','2.0.22')
              p.write_text(text,encoding='utf-8')
          if (root/'index.html').read_bytes()!=(root/'404.html').read_bytes():
              raise SystemExit('index/404 mismatch')
          size=(root/'index.html').stat().st_size
          if size>3_000_000: raise SystemExit(f'HTML still too large: {size}')
          assets=sorted(str(p.as_posix()) for p in out.iterdir() if p.is_file())
          (root/'asset-manifest.json').write_text(json.dumps({'version':'2.0.22','assets':assets},separators=(',',':')),encoding='utf-8')
          vp=root/'version.json'; v=json.loads(vp.read_text(encoding='utf-8'))
          v.update(version='2.0.22',published='2026-09-04',notes='Repository architecture migration: preserves v2.0.21 while moving embedded artwork into local repo assets for smaller directly maintainable HTML. No external runtime assets.')
          vp.write_text(json.dumps(v,indent=2)+'\n',encoding='utf-8')
          cp=root/'CHANGELOG.md'; old=cp.read_text(encoding='utf-8')
          cp.write_text('## v2.0.22 — 2026-09-04\n- Preserved all v2.0.21 Sprite data, 61-entry C7S4 catalogue and Base/Cheat/Hacker/Gold layout.\n- Moved embedded artwork into deterministic local `assets/embedded/` files with no external runtime dependency.\n- Added local asset manifest/offline caching support and reduced HTML size for direct GitHub-connected updates.\n\n'+old,encoding='utf-8')
          print('localized',len(assets),'assets; html bytes',size)
          PY

          python3 - <<'PY'
          from pathlib import Path
          p=Path('service-worker.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("const APP_VERSION = '2.0.21';","const APP_VERSION = '2.0.22';")
          s=s.replace("  './version.json',","  './version.json',\n  './asset-manifest.json',")
          old="self.addEventListener('install', event => {\n  event.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(APP_SHELL)));\n});"
          new="self.addEventListener('install', event => {\n  event.waitUntil((async () => {\n    const cache = await caches.open(CACHE_NAME);\n    await cache.addAll(APP_SHELL);\n    try {\n      const response = await fetch('./asset-manifest.json', {cache:'no-store'});\n      if (response.ok) {\n        const manifest = await response.json();\n        const assets = Array.isArray(manifest.assets) ? manifest.assets : [];\n        for (let i = 0; i < assets.length; i += 40) {\n          await cache.addAll(assets.slice(i, i + 40).map(path => './' + path));\n        }\n      }\n    } catch (err) {\n      console.warn('Asset pre-cache deferred; runtime cache remains available.', err);\n    }\n  })());\n});"
          if old not in s: raise SystemExit('service worker install block not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          checks=[
            '2.0.22' in html,
            "const C7S4_VARIANTS=['Base','Cheat','Hacker','Gold']" in html,
            'repeat(4,minmax' in html,
            'fortnite.gg' not in html.lower(),
          ]
          refs=set(re.findall(r'assets/embedded/[0-9a-f]{20}\.[a-z0-9]+',html))
          if not all(checks): raise SystemExit('content QA failed')
          if len(refs)<200: raise SystemExit(f'asset QA failed: {len(refs)} refs')
          if any(not Path(r).is_file() for r in refs): raise SystemExit('missing local asset')
          print('QA passed with',len(refs),'local assets')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html 404.html service-worker.js version.json CHANGELOG.md asset-manifest.json assets/embedded
          git commit -m 'Release v2.0.22 and migrate artwork to local assets'
          git push origin main
