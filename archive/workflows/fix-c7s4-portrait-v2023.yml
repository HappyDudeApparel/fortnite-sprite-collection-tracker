name: Fix C7S4 portrait grid v2.0.23

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-c7s4-portrait-v2023.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Patch and publish
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python3 - <<'PY'
          from pathlib import Path
          import json

          old_main = '''body.season-c7s4 .variantLegend,body.season-c7s4 .familyRow:not(.legacyPairRow){\n    grid-template-columns:150px repeat(3,64px)!important;\n    min-width:342px!important;\n    width:342px!important;\n    max-width:342px!important;\n  }\n  body.season-c7s4 #familyRows{min-width:342px!important;width:342px!important;max-width:342px!important}'''
          new_main = '''body.season-c7s4 .variantLegend,body.season-c7s4 .familyRow:not(.legacyPairRow){\n    grid-template-columns:150px repeat(4,64px)!important;\n    min-width:406px!important;\n    width:406px!important;\n    max-width:406px!important;\n  }\n  body.season-c7s4 #familyRows{min-width:406px!important;width:406px!important;max-width:406px!important}'''
          old_detail = '''/* Detail variants are only three lanes in C7S4; no surplus horizontal canvas. */\n  body.season-c7s4 .variantRail:not(.legacyCustomRail){--detail-col:78px;--detail-gap:10px}\n  body.season-c7s4 .variantRail:not(.legacyCustomRail) .variantList{\n    grid-template-columns:repeat(3,var(--detail-col))!important;\n    min-width:274px!important;'''
          new_detail = '''/* Detail variants use the same four C7S4 lanes as the main collection: Base, Cheat, Hacker, Gold. */\n  body.season-c7s4 .variantRail:not(.legacyCustomRail){--detail-col:78px;--detail-gap:10px}\n  body.season-c7s4 .variantRail:not(.legacyCustomRail) .variantList{\n    grid-template-columns:repeat(4,var(--detail-col))!important;\n    min-width:362px!important;'''

          for name in ('index.html','404.html'):
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if old_main not in s: raise SystemExit(f'{name}: stale three-lane main portrait block not found')
              if old_detail not in s: raise SystemExit(f'{name}: stale three-lane detail block not found')
              s=s.replace(old_main,new_main,1).replace(old_detail,new_detail,1)
              s=s.replace('2.0.22','2.0.23')
              p.write_text(s,encoding='utf-8')

          if Path('index.html').read_bytes()!=Path('404.html').read_bytes():
              raise SystemExit('index/404 mismatch')

          html=Path('index.html').read_text(encoding='utf-8')
          checks={
            'four_variant_model': "const C7S4_VARIANTS=['Base','Cheat','Hacker','Gold']" in html,
            'portrait_four_lanes': 'grid-template-columns:150px repeat(4,64px)!important' in html,
            'portrait_width': 'min-width:406px!important' in html,
            'detail_four_lanes': 'grid-template-columns:repeat(4,var(--detail-col))!important' in html,
            'no_stale_portrait_3': 'grid-template-columns:150px repeat(3,64px)!important' not in html,
            'no_external_hotlink': 'fortnite.gg' not in html.lower(),
          }
          if not all(checks.values()): raise SystemExit('QA failed: '+repr(checks))

          vp=Path('version.json')
          v=json.loads(vp.read_text(encoding='utf-8'))
          v['version']='2.0.23'
          v['published']='2026-09-05'
          v['notes']='C7S4 portrait layout fix: four compact Base/Cheat/Hacker/Gold lanes now remain aligned in one row, matching the compact C7S3 spacing approach; detail variants corrected to four lanes as well.'
          vp.write_text(json.dumps(v,indent=2)+'\n',encoding='utf-8')

          sw=Path('service-worker.js')
          ss=sw.read_text(encoding='utf-8').replace("const APP_VERSION = '2.0.22';","const APP_VERSION = '2.0.23';")
          sw.write_text(ss,encoding='utf-8')

          am=Path('asset-manifest.json')
          data=json.loads(am.read_text(encoding='utf-8')); data['version']='2.0.23'
          am.write_text(json.dumps(data,separators=(',',':')),encoding='utf-8')

          cp=Path('CHANGELOG.md')
          cp.write_text('## v2.0.23 — 2026-09-05\n- Fixed the later-loading mobile C7S4 CSS that still hard-coded three variant lanes.\n- Portrait now keeps Base, Cheat, Hacker, and Gold in one compact horizontal row with the same tight spacing approach used by C7S3.\n- Corrected the C7S4 detail variant rail from three lanes to four.\n- No Sprite data, artwork, totals, progress, leveling, or saved-state changes.\n\n'+cp.read_text(encoding='utf-8'),encoding='utf-8')
          print(checks)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html 404.html service-worker.js version.json asset-manifest.json CHANGELOG.md
          git commit -m 'Release v2.0.23: fix C7S4 portrait four-column layout'
          git push origin main
