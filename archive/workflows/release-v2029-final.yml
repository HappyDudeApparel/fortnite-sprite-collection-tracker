name: Production maintenance and QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v2029-final.yml']
permissions: {contents: write}
jobs:
  maintain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Normalize production release and archive superseded build debris
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          VERSION='2.0.29'
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          before=s
          s=s.replace('v2.0.28-preview',f'v{VERSION}').replace('2.0.28-preview',VERSION)
          s=s.replace('Sprite Collection Locker — v2.0.28','Sprite Collection Locker — v2.0.29')
          if '2.0.28-preview' in s: raise SystemExit('stale preview label remains')
          if f'Sprite Collection Locker — v{VERSION}' not in s: raise SystemExit('production title version missing')
          p.write_text(s,encoding='utf-8')
          Path(f'v{VERSION}.html').write_text(s,encoding='utf-8')
          Path('version.json').write_text(json.dumps({'version':VERSION,'published':'2026-09-28','notes':'Production cleanup: normalized release metadata/footer, retained the live C7S4 96-Sprite collection and full local assets, archived superseded build/QA debris, and revalidated responsive UI.'},indent=2)+'\n',encoding='utf-8')
          wm=Path('manifest.webmanifest'); m=json.loads(wm.read_text()); m['id']=f'./sprite-collection-locker-v{VERSION}'; m['start_url']=f'./index.html?v={VERSION}'; wm.write_text(json.dumps(m,indent=2)+'\n')
          am=Path('asset-manifest.json'); m=json.loads(am.read_text()); m['version']=VERSION; am.write_text(json.dumps(m,separators=(',',':')))
          sw=Path('service-worker.js'); x=sw.read_text(); x=re.sub(r"const APP_VERSION = '[^']+'",f"const APP_VERSION = '{VERSION}'",x)
          if "'./index.html'," not in x: x=x.replace("const APP_SHELL = [","const APP_SHELL = [\n  './index.html',",1)
          sw.write_text(x)
          Path('404.html').write_text('''<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=/"><title>Sprite Collection Locker</title><script>location.replace('/'+location.search+location.hash)</script></head><body><a href="/">Open Sprite Collection Locker</a></body></html>\n''')
          OBJ=re.compile(r'\{[^{}]*"id"\s*:\s*\d+[^{}]*\}')
          def recs(text,season):
            out=[]
            for mm in OBJ.finditer(text):
              raw=mm.group(0)
              if '"variantKey"' not in raw or '"image"' not in raw: continue
              try:r=json.loads(raw)
              except:continue
              if r.get('season')==season: out.append(r)
            return out
          rr=recs(s,'C7S4')
          assert len(rr)==96 and len({r['family'] for r in rr})==20
          assert {k:sum(r['variantKey']==k for r in rr) for k in ('Base','Gold','Cheat','Hacker','Bounty')}=={'Base':20,'Gold':19,'Cheat':19,'Hacker':19,'Bounty':19}
          assert not any(r['family']=='Birthday' for r in rr)
          assert sum(r['family']=='Morgana' for r in rr)==5
          assert all(r.get('releaseState')=='released' and not r.get('preview') and r.get('countsTowardCollection') for r in rr)
          assert all(Path(r['image']).is_file() and 'preview-v2028' not in r['image'] and not r['image'].startswith(('http://','https://','//')) for r in rr)
          old3=recs(before,'C7S3'); new3=recs(s,'C7S3'); assert old3==new3 and old3, 'C7S3 changed or missing'
          man=json.loads(Path('asset-manifest.json').read_text()); missing=[a for a in man.get('assets',[]) if not Path(a).is_file()]; assert not missing, 'manifest missing assets: '+repr(missing[:10])
          assert json.loads(Path('version.json').read_text())['version']==VERSION
          assert json.loads(Path('asset-manifest.json').read_text())['version']==VERSION
          assert json.loads(Path('manifest.webmanifest').read_text())['start_url'].endswith('v='+VERSION)
          assert f"APP_VERSION = '{VERSION}'" in Path('service-worker.js').read_text()
          print('PASS static: version agreement / C7S4 96 / C7S3 unchanged / local assets')
          PY
          mkdir -p archive/releases/v2.0.28 archive/qa-pre-v2.0.29 archive/workflows
          for f in v2.0.28.html v2.0.28-preview.html v2.0.28-preview-manifest.json; do [ ! -e "$f" ] || git mv "$f" archive/releases/v2.0.28/; done
          for f in audit-c7s3-*.png audit-c7s3-visible-bounds.json qa-c7s4-native-*.png qa-landscape.png qa-portrait.png qa-v2028-*.png; do [ ! -e "$f" ] || git mv "$f" archive/qa-pre-v2.0.29/; done
          for f in .github/workflows/*.yml; do [ "$f" = '.github/workflows/release-v2029-final.yml' ] && continue; git mv "$f" archive/workflows/$(basename "$f"); done
          rm -f qa-v2029-*.png
      - name: Browser QA before push
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 4173 >/tmp/sprite-http.log 2>&1 & echo $! >/tmp/sprite-http.pid
          trap 'kill $(cat /tmp/sprite-http.pid) 2>/dev/null || true' EXIT
          sleep 1
          cat > /tmp/qa.js <<'JS'
          const {chromium}=require('playwright'); const base='http://127.0.0.1:4173/';
          async function clickExact(p,n){const b=p.getByRole('button',{name:n,exact:true});if(await b.count()){await b.first().click();await p.waitForTimeout(250);return true}return false}
          (async()=>{const browser=await chromium.launch({headless:true});
            for(const [w,h,n] of [[360,800,'phone-small'],[393,852,'phone'],[412,915,'phone-wide'],[852,393,'landscape'],[1024,768,'tablet'],[1440,900,'desktop']]){
              const p=await browser.newPage({viewport:{width:w,height:h}});const errs=[];p.on('pageerror',e=>errs.push('page:'+e.message));p.on('requestfailed',r=>errs.push('request:'+r.url()));
              const res=await p.goto(base+'?qa='+Date.now(),{waitUntil:'networkidle'});if(!res||!res.ok())throw Error(n+' navigation failed');if(!/v2\.0\.29/.test(await p.title()))throw Error(n+' wrong title '+await p.title());
              if(!await clickExact(p,'C7S4'))throw Error(n+' C7S4 button missing');
              const q=await p.evaluate(()=>{const t=document.querySelector('.variantTable');return{text:t?.innerText||'',bad:t?.querySelectorAll('.spriteCell.preview,.previewBadge').length||0,bw:document.body.scrollWidth,hw:document.documentElement.scrollWidth,vw:innerWidth,imgs:[...document.images].filter(x=>x.offsetParent!==null).map(x=>({src:x.getAttribute('src'),ok:x.complete&&x.naturalWidth>0})),nums:[...document.querySelectorAll('.sumNum')].map(x=>x.textContent.trim()),body:document.body.innerText}});
              if(!q.nums.includes('96'))throw Error(n+' C7S4 total is not 96: '+JSON.stringify(q.nums));if(/Birthday Sprite|\bComing\b|\bSoon\b/i.test(q.text)||q.bad)throw Error(n+' unreleased collection leak');if(!/Morgana/i.test(q.text))throw Error(n+' Morgana missing');if(q.imgs.some(x=>!x.ok))throw Error(n+' visible broken image');if(w<=760&&(q.bw>q.vw+1||q.hw>q.vw+1))throw Error(n+' horizontal viewport overflow');if(/2\.0\.28-preview/.test(q.body))throw Error(n+' stale preview footer visible');if(!/v2\.0\.29/.test(q.body))throw Error(n+' visible v2.0.29 label missing');
              if(!await clickExact(p,'C7S3'))throw Error(n+' C7S3 button missing');const c3=await p.locator('.variantTable').innerText();if(!c3.trim())throw Error(n+' C7S3 failed to render');if(errs.length)throw Error(n+' runtime errors '+errs.join(' | '));await p.close();console.log('PASS UI '+n)
            }
            const p=await browser.newPage({viewport:{width:393,height:852}});await p.goto(base+'?proof='+Date.now(),{waitUntil:'networkidle'});await p.evaluate(()=>scrollTo(0,document.body.scrollHeight));await p.waitForTimeout(300);const loc=p.getByText(/v2\.0\.29/).last();if(!await loc.count())throw Error('version proof label not found');await loc.scrollIntoViewIfNeeded();const box=await loc.boundingBox();if(!box)throw Error('version proof label has no box');const x=Math.max(0,box.x-18),y=Math.max(0,box.y-18),width=Math.min(393-x,Math.max(220,box.width+36)),height=Math.min(852-y,Math.max(90,box.height+36));await p.screenshot({path:'qa-v2029-version-proof.png',clip:{x,y,width,height}});await p.close();await browser.close()
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/qa.js
          rm -rf node_modules package.json package-lock.json
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A; git diff --cached --check; git status --short
          git commit -m 'maintenance: clean production tree and verify v2.0.29'
          git push origin HEAD:main
