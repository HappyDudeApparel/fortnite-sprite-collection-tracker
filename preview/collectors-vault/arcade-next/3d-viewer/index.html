<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1f34">
<title>Sprite Character Viewer (Next, staging preview)</title>
<style>
:root{--bg:#0b1f34;--panel:#10304dcc;--line:#7ce5f766;--ink:#eaf8ff;--mute:#9fc4d8;--ok:#6ee7a0;--warn:#ffd25e;--bad:#ff7b8a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:grid;grid-template-rows:auto 1fr auto;height:100dvh}
header{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:#0a2540}
header h1{font-size:15px;margin:0 8px 0 0}
select,button,input[type=number]{font:inherit;color:var(--ink);background:#143a5c;border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-height:36px}
button{cursor:pointer}button[aria-pressed=true]{background:#1f7aa8;border-color:#a8f0ff}
a.back{color:var(--mute);margin-left:auto;text-decoration:none}
main{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:0}
#stageWrap{position:relative;display:grid;grid-template-columns:auto 1fr;min-height:0}
#refPane{display:none;width:min(34vw,320px);padding:10px;border-right:1px solid var(--line);background:#0a2238;overflow:auto}
#refPane img{width:100%;border-radius:12px;background:#fff}
#refPane h3{margin:0 0 8px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
#view{position:relative;min-height:0;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hint{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--mute);background:#0a2238b3;padding:4px 8px;border-radius:8px;pointer-events:none}
#side{overflow:auto;padding:12px;border-left:1px solid var(--line);background:#0a2238}
#side h2{margin:14px 0 6px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
#side h2:first-child{margin-top:0}
.row{display:flex;flex-wrap:wrap;gap:6px}
.stat{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px}
.stat span:nth-child(odd){color:var(--mute)}
.rule{padding:6px 8px;margin:4px 0;border-radius:8px;font-size:12px;border-left:4px solid var(--ok);background:#0d2d48}
.rule.warn{border-color:var(--warn)}.rule.fail{border-color:var(--bad)}
.rule b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:800;text-transform:uppercase}
.badge.pass{background:#12482f;color:var(--ok)}.badge.warn{background:#4a3a0b;color:var(--warn)}.badge.fail{background:#521622;color:var(--bad)}
footer{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);background:#0a2540}
footer input[type=range]{flex:1 1 160px;min-width:120px}
#err{display:none;position:absolute;inset:0;place-items:center;text-align:center;padding:24px;background:#0b1f34}
@media (max-width:860px){main{grid-template-columns:1fr;grid-template-rows:minmax(260px,1fr) auto}#side{max-height:42dvh;border-left:0;border-top:1px solid var(--line)}#refPane{width:30vw}}
</style>
<script type="importmap">{"imports":{"three":"../../arcade/3d/vendor/three/three.module.min.js","three/addons/":"../../arcade/3d/vendor/three/addons/"}}</script>
</head>
<body>
<header>
  <h1>Sprite Character Viewer</h1>
  <label>Character <select id="charSel" aria-label="Character"></select></label>
  <span class="row" id="presets" role="group" aria-label="Camera views">
    <button data-view="front">Front</button><button data-view="three">3/4</button><button data-view="side">Side</button><button data-view="back">Back</button><button data-view="top">Top</button>
  </span>
  <button id="turn" aria-pressed="false">Turntable</button>
  <button id="wire" aria-pressed="false">Wireframe</button>
  <button id="skel" aria-pressed="false">Skeleton</button>
  <button id="look" aria-pressed="false" hidden>Game look</button>
  <label>Art ref # <input id="refId" type="number" min="1" max="999" style="width:78px"></label>
  <a class="back" href="/preview/collectors-vault/arcade/">&larr; Games</a>
</header>
<main>
  <div id="stageWrap">
    <aside id="refPane"><h3>Collection art (reference)</h3><img id="refImg" alt="Collection artwork used as the visual reference"><p id="refName" style="color:var(--mute);font-size:12px"></p></aside>
    <div id="view"><canvas id="c" aria-label="3D character view"></canvas><div id="hint">Drag to rotate · wheel / pinch to zoom</div>
      <div id="err" role="alert"></div></div>
  </div>
  <aside id="side">
    <h2>Verdict</h2><div id="verdict"></div>
    <h2>Model</h2><div class="stat" id="stats"></div>
    <h2>Pipeline rules</h2><div id="rules"></div>
    <h2>Provenance</h2><div id="prov" style="font-size:12px;color:var(--mute)"></div>
  </aside>
</main>
<footer>
  <label>Animation <select id="clipSel" aria-label="Animation clip"></select></label>
  <button id="play" aria-pressed="true">Pause</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Animation time">
  <span id="time" style="color:var(--mute);min-width:96px">0.00 / 0.00 s</span>
</footer>
<script type="module" src="viewer.js"></script>
</body>
</html>
