name: C7S5 themes and icon non-regression QA
on:
  push:
    branches:
      - main
      - feature/c7s5-theme-toggle-v2049
      - feature/c7s5-illustrated-skins-v2050
    paths:
      - index.html
      - version.json
      - manifest.webmanifest
      - service-worker.js
      - asset-manifest.json
      - assets/ui/c7s5-*.svg
      - .github/workflows/c7s5-theme-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  themes:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate all five SVG assets and C7S3/C7S4 roster preservation
        run: |
          python - <<'PY'
          import json,re,pathlib,xml.etree.ElementTree as ET
          s=pathlib.Path('index.html').read_text()
          assert '<button type="button" id="c7s5ThemeToggle"' in s
          a=s.index('const SPRITES=')+len('const SPRITES=')
          b=s.index('];',a)+1
          r=json.loads(s[a:b])
          assert len(r)==314
          assert len(set(x['id'] for x in r))==314
          assert sum(x['season']=='C7S3' for x in r)==119
          assert sum(x['season']=='C7S4' for x in r)==162
          assert sum(x['season']=='C7S5' for x in r)==33
          assert sum(x['season']=='C7S5' and x['variantKey']=='Base' for x in r)==11
          assert sum(x['season']=='C7S5' and x['variantKey']=='Fortune' for x in r)==11
          assert sum(x['season']=='C7S5' and x['variantKey']=='Cursed' for x in r)==11
          for name in ['fortune-charm','cursed-relic','map','sea','tavern']:
            p=pathlib.Path('assets/ui/c7s5-'+name+'.svg')
            assert p.exists(),p
            root=ET.parse(p).getroot()
            assert root.attrib.get('viewBox'),name
          ver=json.loads(pathlib.Path('version.json').read_text())['version']
          assert ver=='2.0.50'
          assert ver==json.loads(pathlib.Path('asset-manifest.json').read_text())['version']
          assert "const APP_VERSION='"+ver+"'" in s
          assert "const APP_VERSION = '"+ver+"'" in pathlib.Path('service-worker.js').read_text()
          assert json.loads(pathlib.Path('manifest.webmanifest').read_text())['start_url']=='./index.html?v='+ver
          for theme in ['map','sea','tavern']:
            for bit in ['hero','panel','footer']:
              p=pathlib.Path('assets/ui/c7s5-illustrated-'+theme+'-'+bit+'.webp')
              assert p.exists() and p.stat().st_size>10000,p
              assert p.read_bytes()[:4]==b'RIFF' and p.read_bytes()[8:12]==b'WEBP',p
          print('PASS: reference-accurate illustrated assets, XML, themes, 3 season totals, release metadata')
          PY
      - name: Install Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Browser-test three themes, season switching, progress and layout; capture screenshots
        run: |
          python - <<'PY'
          import threading,http.server
          from playwright.sync_api import sync_playwright
          srv=http.server.ThreadingHTTPServer(('127.0.0.1',8765),http.server.SimpleHTTPRequestHandler)
          threading.Thread(target=srv.serve_forever,daemon=True).start()
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True,args=['--no-sandbox'])
            for width,height,name in [(390,844,'mobile'),(1440,900,'desktop')]:
              page=b.new_page(viewport={'width':width,'height':height},device_scale_factor=1)
              js_errors=[]
              page.on('pageerror',lambda e:js_errors.append(str(e)))
              page.goto('http://127.0.0.1:8765/',wait_until='domcontentloaded',timeout=60000)
              page.wait_for_selector('.familyRow[data-family="Chester"]',timeout=55000)
              assert page.evaluate('currentSeason')=='C7S5'
              assert page.evaluate('countable().length')==33
              assert page.locator('.familyRow').count()==11
              assert page.locator('#mainLegend .legendItem').count()==4
              assert page.locator('#c7s5ThemeToggle').is_visible()
              old_favs=page.evaluate('localStorage.getItem("scl-clean-favorites")')
              dims=[]
              for mode in ['map','sea','tavern']:
                assert page.evaluate('document.body.dataset.c7s5Theme')==mode
                dims.append(page.evaluate('''() => ({
                  legend:getComputedStyle(document.querySelector('#mainLegend')).gridTemplateColumns,
                  rows:getComputedStyle(document.querySelector('.familyRow')).gridTemplateColumns,
                  width:document.querySelector('#variantTable').clientWidth,
                  height:document.querySelector('.familyRow').offsetHeight,
                  visual:getComputedStyle(document.querySelector('.familyRow')).backgroundImage,
                  icon:getComputedStyle(document.querySelector('.variantLegend .v-Fortune')).backgroundImage
                })'''))
                assert 'c7s5-fortune-charm.svg' in dims[-1]['icon']
                banner=page.locator('.c7s5Banner').evaluate('(el)=>getComputedStyle(el).backgroundImage')
                assert 'c7s5-illustrated-'+mode+'-hero.webp' in banner, ('Wrong illustrated theme hero',mode,banner)
                status=page.request.get('http://127.0.0.1:8765/assets/ui/c7s5-illustrated-'+mode+'-hero.webp')
                assert status.ok and status.body()[:4]==b'RIFF',mode+' artwork not delivered'
                assert dims[-1]['visual']!='none'
                assert dims[-1]['rows']==dims[-1]['legend'],(mode,dims[-1])
                page.screenshot(path='qa-c7s5-'+name+'-'+mode+'.png',full_page=False)
                page.locator('#c7s5ThemeToggle').click()
              assert page.evaluate('document.body.dataset.c7s5Theme')=='map'
              assert len(set((x['legend'],x['rows'],x['width'],x['height']) for x in dims))==1,'A theme changed row geometry'
              page.locator('#c7s5ThemeToggle').click()
              assert page.evaluate('document.body.dataset.c7s5Theme')=='sea'
              page.reload(wait_until='domcontentloaded')
              page.wait_for_selector('.familyRow[data-family="Chester"]',timeout=30000)
              assert page.evaluate('document.body.dataset.c7s5Theme')=='sea','theme preference not persisted'
              assert page.locator('#mainLegend .legendItem').count()==4
              assert page.evaluate('countable().length')==33
              assert page.evaluate('localStorage.getItem("scl-clean-favorites")')==old_favs,'theme touched progress storage'
              page.locator('button[data-season="C7S4"]').click()
              assert page.evaluate('countable().length')==162
              assert page.locator('#mainLegend .legendItem').count()==7
              assert not page.evaluate('document.body.classList.contains("season-c7s5")')
              page.locator('button[data-season="C7S3"]').click()
              assert page.evaluate('countable().length')==117
              assert page.locator('#mainLegend .legendItem').count()==8
              page.locator('button[data-season="C7S5"]').click()
              assert page.evaluate('document.body.dataset.c7s5Theme')=='sea'
              assert page.evaluate('countable().length')==33
              assert not js_errors,js_errors[:5]
              print('PASS',name,'3 themes, style-only geometry invariant, reload persistence, C7S3/C7S4 counts, no JS exceptions')
              page.close()
            b.close()
          srv.shutdown()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c7s5-three-theme-screenshots
          path: qa-c7s5-*.png
          if-no-files-found: ignore
