name: Approved season designs and collection regression QA
on:
  push:
    branches: [main]
    paths:
      - index.html
      - version.json
      - manifest.webmanifest
      - service-worker.js
      - asset-manifest.json
      - assets/ui/**
      - scripts/qa-*.py
      - .github/workflows/c7s5-theme-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  themes:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install browser and artwork validators
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Validate premium themes, responsive UI and collection workflows
        run: python scripts/qa-c7s5-premium.py --output /tmp/c7s5-premium-qa
      - name: Validate approved artwork, navigation and independent season persistence
        run: python scripts/qa-navigation.py --output /tmp/c7s5-premium-qa/navigation
      - name: Validate image-registered route, original bubbles and tavern ambience
        run: python scripts/qa-c7s5-atmosphere.py --output /tmp/c7s5-premium-qa/atmosphere
      - name: Verify GitHub Pages publication and live themes
        run: python scripts/qa-c7s5-live.py --output /tmp/c7s5-premium-qa --timeout 180
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c7s5-premium-qa
          path: /tmp/c7s5-premium-qa/
          if-no-files-found: ignore
