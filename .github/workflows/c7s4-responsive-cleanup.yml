# The former v2.0.31 auto-rewrite workflow was retired on 2026-10-21.
# NEVER restore its 'git push origin HEAD:main' step or contents: write permission.
# This workflow is READ-ONLY. Actual responsive fixes must be reviewed in a PR.
name: C7S4 responsive integrity QA (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c7s4-responsive-cleanup.yml'
      - 'index.html'
      - 'version.json'
      - 'service-worker.js'
      - 'asset-manifest.json'
  pull_request:
    paths:
      - '.github/workflows/c7s4-responsive-cleanup.yml'
      - 'index.html'
      - 'version.json'
      - 'service-worker.js'
      - 'asset-manifest.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify C7S3 preservation and release consistency without editing files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, json, re

          # Approved v2.0.44 snapshot; immutable C7S3 records are protected,
          # but later C7S4 additions are permitted.
          BASE = '16161c4e1b898308e6b26c811ebbc780acc0aecc'
          html = Path('index.html').read_text(encoding='utf-8')
          before = subprocess.check_output(['git', 'show', f'{BASE}:index.html']).decode('utf-8')

          def sprites(source):
              marker = 'const SPRITES='
              pos = source.index(marker) + len(marker)
              end = source.index(';\n', pos)
              return json.loads(source[pos:end])

          previous, current = sprites(before), sprites(html)
          old_s3 = [item for item in previous if item.get('season') == 'C7S3']
          now_s3 = [item for item in current if item.get('season') == 'C7S3']
          s4 = [item for item in current if item.get('season') == 'C7S4']
          assert len(old_s3) == 119 and now_s3 == old_s3, 'C7S3 historical records changed'
          assert len(s4) >= 162, 'C7S4 records were lost'

          version = json.loads(Path('version.json').read_text())['version']
          asset_version = json.loads(Path('asset-manifest.json').read_text())['version']
          sw_version = re.search(r"const APP_VERSION = '([^']+)'", Path('service-worker.js').read_text()).group(1)
          page_version = re.search(r"const APP_VERSION='([^']+)'", html).group(1)
          assert version == asset_version == sw_version == page_version, 'Release version mismatch'
          assert 'class="playGamesBtn' in html or 'playGamesBtn' in html, 'Missing Sprite Games entry'
          # Do not change manifest.webmanifest's stable PWA id as part of QA;
          # PWA identity migrations require separate deliberate review.
          print(f'PASS: read-only; version {version}, C7S3 {len(now_s3)} immutable, C7S4 {len(s4)}')
          PY
