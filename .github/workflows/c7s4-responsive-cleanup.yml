name: C7S4 responsive cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c7s4-responsive-cleanup.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          patch=r'''
<style id="v2031-c7s4-responsive-cleanup">
/* C7S4 uses one table-level horizontal viewport, matching C7S3 behaviour. */
body.season-c7s4 .variantTable{overflow-x:auto!important;overflow-y:visible!important;-webkit-overflow-scrolling:touch!important;scrollbar-width:thin!important}
body.season-c7s4 #familyRows{min-width:var(--c7s4-grid-width)!important;width:var(--c7s4-grid-width)!important}
body.season-c7s4 .variantLegend,body.season-c7s4 .familyRow{
  grid-template-columns:var(--c7s4-hero) repeat(var(--c7s4-cols),var(--c7s4-cell))!important;
  min-width:var(--c7s4-grid-width)!important;width:var(--c7s4-grid-width)!important;max-width:none!important
}
@media(max-width:760px){
  body.season-c7s4 .mainShell{overflow-x:hidden!important}
  body.season-c7s4 .variantTable{width:100%!important;max-width:100%!important;overflow-x:auto!important;overflow-y:visible!important}
  body.season-c7s4 .variantLegend{
    display:grid!important;position:sticky!important;top:0!important;z-index:21!important;
    padding:7px 8px!important;min-height:50px!important;background:rgba(8,16,31,.98)!important
  }
  body.season-c7s4 .variantLegend .legendFamily{font-size:10px!important}
  body.season-c7s4 .variantLegend .legendItem{font-size:10px!important;gap:4px!important;justify-self:center!important}
  body.season-c7s4 .variantLegend .dot{width:11px!important;height:11px!important;flex:0 0 11px!important}
  body.season-c7s4 #familyRows{min-width:var(--c7s4-grid-width)!important;width:var(--c7s4-grid-width)!important}
  body.season-c7s4 .familyRow{
    overflow:visible!important;margin:0!important;border-width:0 0 1px!important;border-radius:0!important;
    padding:8px!important;min-width:var(--c7s4-grid-width)!important;width:var(--c7s4-grid-width)!important;max-width:none!important
  }
  body.season-c7s4 .familyHero{
    grid-template-columns:1fr!important;width:var(--c7s4-hero)!important;min-width:var(--c7s4-hero)!important;
    justify-items:center!important;text-align:center!important
  }
  body.season-c7s4 .familyName{font-size:14px!important;white-space:normal!important;overflow:visible!important;text-overflow:clip!important}
  body.season-c7s4 .spriteCell,body.season-c7s4 .emptyCell{width:var(--c7s4-cell)!important;min-width:var(--c7s4-cell)!important;max-width:var(--c7s4-cell)!important}
}
</style>
<script id="v2031-c7s4-responsive-hook">
(()=>{function tidy(){
 if(!document.body.classList.contains('season-c7s4'))return;
 const mobile=innerWidth<=760,hero=mobile?108:320,cell=mobile?58:88;
 const rows=[...document.querySelectorAll('.familyRow')].filter(x=>x.offsetParent!==null);
 const legend=[...document.querySelectorAll('.variantLegend')].find(x=>x.offsetParent!==null);
 const cols=Math.max(legend?legend.children.length-1:0,...rows.map(r=>Math.max(0,r.children.length-1)));
 document.body.style.setProperty('--c7s4-hero',hero+'px');
 document.body.style.setProperty('--c7s4-cell',cell+'px');
 document.body.style.setProperty('--c7s4-cols',String(cols));
 document.body.style.setProperty('--c7s4-grid-width',(hero+cols*cell)+'px');
}
document.addEventListener('click',()=>setTimeout(tidy,0),true);addEventListener('resize',tidy);
new MutationObserver(()=>setTimeout(tidy,0)).observe(document.body,{attributes:true,attributeFilter:['class'],childList:true,subtree:true});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',tidy);else tidy()})();
</script>
'''
          s=s.replace('</body></html>',patch+'</body></html>')
          s=s.replace('Sprite Collection Locker — v2.0.30','Sprite Collection Locker — v2.0.31')
          p.write_text(s)
          Path('v2.0.31.html').write_text(s)
          import json,re
          v=Path('version.json'); d=json.loads(v.read_text()); d['version']='2.0.31'; d['published']='2026-10-01'; d['notes']='C7S4 responsive cleanup: restored portrait genre legend and one shared horizontal table scroll; tightened mobile family lane while preserving C7S3.'; v.write_text(json.dumps(d,indent=2)+'\n')
          for fn in ['asset-manifest.json','manifest.webmanifest']:
            q=Path(fn); d=json.loads(q.read_text())
            if fn=='asset-manifest.json': d['version']='2.0.31'
            else: d['id']='./sprite-collection-locker-v2.0.31'; d['start_url']='./index.html?v=2.0.31'
            q.write_text(json.dumps(d,indent=2)+'\n')
          q=Path('service-worker.js'); x=q.read_text(); x=re.sub(r"const APP_VERSION = '[^']+'","const APP_VERSION = '2.0.31'",x); q.write_text(x)
          PY
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 4173 >/tmp/http.log 2>&1 & HP=$!
          trap 'kill $HP 2>/dev/null || true' EXIT
          sleep 1
          cat >/tmp/qa.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});
          for(const [w,h,n] of [[360,800,'p360'],[393,852,'p393'],[412,915,'p412'],[852,393,'landscape'],[1024,768,'tablet'],[1440,900,'desktop']]){
            const p=await b.newPage({viewport:{width:w,height:h}}),errs=[];p.on('pageerror',e=>errs.push(e.message));
            await p.goto('http://127.0.0.1:4173/?qa='+Date.now(),{waitUntil:'networkidle'});
            const t=p.getByRole('button',{name:'C7S4',exact:true});if(await t.count())await t.first().click();await p.waitForTimeout(150);
            const q=await p.evaluate(()=>{let tab=document.querySelector('.variantTable'),leg=document.querySelector('.variantLegend'),rows=[...document.querySelectorAll('.familyRow')].filter(x=>x.offsetParent!==null);return{legend:getComputedStyle(leg).display,tableOverflow:getComputedStyle(tab).overflowX,rowOverflow:[...new Set(rows.map(r=>getComputedStyle(r).overflowX))],bodyOverflow:document.documentElement.scrollWidth-innerWidth,rows:rows.length,title:document.title}});
            if(!/2\.0\.31/.test(q.title))throw Error(n+' wrong version');
            if(w<=760&&q.legend==='none')throw Error(n+' legend hidden');
            if(w<=760&&q.tableOverflow!=='auto')throw Error(n+' table is not shared scroller: '+q.tableOverflow);
            if(w<=760&&q.rowOverflow.some(x=>x==='auto'||x==='scroll'))throw Error(n+' individual row scroll remains '+q.rowOverflow);
            if(q.bodyOverflow>1)throw Error(n+' page overflow '+q.bodyOverflow);
            if(!q.rows)throw Error(n+' no rows');if(errs.length)throw Error(n+' '+errs.join('|'));
            console.log('PASS',n,q);await p.close();
          }
          await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/qa.js
          rm -rf node_modules package.json package-lock.json
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: clean C7S4 responsive table layout'
          git push origin HEAD:main
