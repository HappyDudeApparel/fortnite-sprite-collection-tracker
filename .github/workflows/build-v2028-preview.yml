name: Build v2.0.28 preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-v2028-preview.yml']
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Build isolated preview
        shell: bash
        run: |
          set -euo pipefail
          cp index.html v2.0.28-preview.html
          python3 - <<'PY'
          from pathlib import Path
          import json,re,urllib.request,urllib.parse,hashlib,html as H
          p=Path('v2.0.28-preview.html'); s=p.read_text('utf-8')
          assert "APP_VERSION='2.0.27'" in s
          m=re.search(r'const SPRITES=(\[.*?\]);\nconst BACKGROUNDS=',s,re.S); assert m
          data=json.loads(m.group(1)); c4=[x for x in data if x.get('season')=='C7S4']; assert len(c4)==61
          base_meta={
            'Crash Bandicoot':('Legendary','While midair, perform a spin attack that damages and knocks back nearby opponents.','Spotted near high and mountainous areas','Damage increases and cooldown decreases with each Level Up!'),
            'Blinky':('Legendary','Taking damage cloaks you for a short time, making you harder to spot.','Found in the world at nighttime','Cloak lasts longer with each Level Up!'),
            'Pond':('Epic','Gain regenerating Super Jump charges. Jump shortly after landing to activate one.','Spotted near high and mountainous areas','Jump strength increases and cooldown decreases with each Level Up!'),
            'Birthday':('Rare','Opening chests has a chance to spawn a slice of cake; at max level eliminations can too.','Spotted near high and mountainous areas','Cake spawn chance increases with each Level Up!'),
            'Morgana':('Epic','Increases the effectiveness of healing items.','Location not yet verified','Healing effectiveness increases with each Level Up!')}
          def norm(x): return re.sub(r'[^a-z0-9]+','-',x.lower()).strip('-')
          pages={}; ua={'User-Agent':'Mozilla/5.0 SpriteCollectionLocker/2.0.28'}
          initial=['Crash Bandicoot','Blinky','Pond','Birthday','Morgana']
          existing=sorted({x['family'] for x in c4 if x['family']!='Mega Man'})
          for fam in sorted(set(initial+existing)):
            try:
              req=urllib.request.Request(f'https://spritechecklist.org/sprites/{norm(fam)}/',headers=ua)
              with urllib.request.urlopen(req,timeout=30) as r: pages[fam]=r.read().decode('utf-8','ignore')
            except Exception as e: print('page warning',fam,e)
          req=urllib.request.Request('https://spritechecklist.org/',headers=ua)
          with urllib.request.urlopen(req,timeout=30) as r: pages['_home']=r.read().decode('utf-8','ignore')
          def urls_for(text):
            vals=[]
            for pat in [r'<img[^>]+(?:src|data-src)=["\']([^"\']+)',r'https?://[^"\'<> ]+\.(?:png|webp|jpg|jpeg)']:
              vals += re.findall(pat,text,re.I)
            out=[]
            for u in vals:
              u=H.unescape(u)
              if u.startswith('//'): u='https:'+u
              elif u.startswith('/'): u='https://spritechecklist.org'+u
              if u.startswith('http') and u not in out: out.append(u)
            return out
          all_urls={fam:urls_for(txt) for fam,txt in pages.items()}
          labels={'Base':['base','normal'],'Cheat':['cheat','cheat-master'],'Hacker':['hacker','loot-hacker'],'Gold':['gold'],'Bounty':['bounty','bounty-hunter']}
          def pick(fam,var):
            f=norm(fam); candidates=[]; pool=all_urls.get(fam,[])+all_urls.get('_home',[])
            for u in dict.fromkeys(pool):
              nu=norm(urllib.parse.unquote(u)); score=sum(4 for t in f.split('-') if len(t)>2 and t in nu)
              if var=='Base':
                if not any(t in nu for t in ['gold','cheat','hacker','bounty']): score+=5
              else: score += max(6 if t in nu else 0 for t in labels[var])
              if 'sprite' in nu: score+=2
              if score: candidates.append((score,u))
            candidates.sort(reverse=True); return candidates[0][1] if candidates and candidates[0][0]>=6 else None
          variants=['Base','Cheat','Hacker','Gold','Bounty']; wanted=[]
          for fam in ['Crash Bandicoot','Blinky','Pond']: wanted += [(fam,v) for v in variants]
          wanted += [(fam,'Bounty') for fam in existing]
          for fam in ['Birthday','Morgana']: wanted += [(fam,v) for v in variants]
          assert len(wanted)==40, len(wanted)
          resolved={}; missing=[]
          for key in wanted:
            u=pick(*key)
            if u: resolved[key]=u
            else: missing.append(key)
          print('resolved',len(resolved),'missing',missing)
          if missing: raise SystemExit('QA ABORT unresolved artwork '+repr(missing))
          out=Path('assets/preview-v2028'); out.mkdir(parents=True,exist_ok=True); local={}
          for key,u in resolved.items():
            raw=urllib.request.urlopen(urllib.request.Request(u,headers=ua),timeout=30).read()
            if len(raw)<1500: raise SystemExit(f'suspicious asset {key} {len(raw)}')
            ext='webp'; path=urllib.parse.urlparse(u).path.lower()
            for e in ('png','webp','jpg','jpeg'):
              if path.endswith('.'+e): ext='jpg' if e=='jpeg' else e
            rel=f'assets/preview-v2028/{hashlib.sha256(raw).hexdigest()[:20]}.{ext}'; Path(rel).write_bytes(raw); local[key]=rel
          maxid=max(x['id'] for x in data); nextid=maxid+1; byfam={}
          for x in c4: byfam.setdefault(x['family'],[]).append(x)
          def add(fam,var,img):
            global nextid
            if fam in base_meta: rarity,desc,loc,lvl=base_meta[fam]
            else:
              base=byfam[fam][0]; rarity=base['rarity']; desc=base['description']; loc=base.get('location',''); lvl=base.get('levelUp',desc)
            base=byfam.get(fam,[{}])[0]; vk=var
            variant={'Base':'Base','Cheat':'Cheat Master','Hacker':'Loot Hacker','Gold':'Gold','Bounty':'Bounty Hunter'}[var]
            name=(fam+' Sprite') if var=='Base' else (variant+' '+fam+' Sprite'); effect=desc
            if var=='Gold': effect='Gain 3x bonus Sprite XP from eliminations'
            elif var=='Cheat': effect='All Cheat Code inputs count as correct'
            elif var=='Hacker': effect='Increases chances of spawning items from your Loot Hacks'
            elif var=='Bounty': effect='Chance to find Sprites from eliminations; levels up only from eliminations'
            rec={'id':nextid,'family':fam,'displayFamily':fam,'familyName':fam+' Sprite','variantKey':vk,'variant':variant,'variantOrder':{'Base':0,'Cheat':1,'Hacker':2,'Gold':3,'Bounty':4}[var],'name':name,'description':desc,'location':loc,'effect':effect,'rarity':rarity if var=='Base' else 'Special','image':img,'releaseState':'catalogued','summonCost':base.get('summonCost'),'spriteChestChance':'Not published','standardIndex':nextid,'status':'Collectible','preview':False,'countsTowardCollection':True,'levelUp':lvl,'season':'C7S4'}
            nextid+=1; data.append(rec); byfam.setdefault(fam,[]).append(rec)
          for fam,var in wanted: add(fam,var,local[(fam,var)])
          c4new=[x for x in data if x.get('season')=='C7S4']; assert len(c4new)==101,len(c4new)
          keys=[(x['family'],x['variantKey']) for x in c4new]; assert len(keys)==len(set(keys))
          s=s[:m.start(1)]+json.dumps(data,separators=(',',':'))+s[m.end(1):]
          s=s.replace("const C7S4_VARIANTS=['Base','Cheat','Hacker','Gold']","const C7S4_VARIANTS=['Base','Cheat','Hacker','Gold','Bounty']")
          s=s.replace("APP_VERSION='2.0.27'","APP_VERSION='2.0.28-preview'").replace('Sprite Collection Locker — v2.0.27','Sprite Collection Locker — v2.0.28 PREVIEW')
          insert='''\n<style id="v2028-preview-c7s4-only">\nbody[data-season="C7S4"] .variantLegend,body[data-season="C7S4"] .familyRow{grid-template-columns:minmax(230px,320px) repeat(5,minmax(62px,1fr))}\n</style>\n'''
          s=s.replace('</head>',insert+'</head>',1); p.write_text(s,'utf-8')
          Path('v2.0.28-preview-manifest.json').write_text(json.dumps({'version':'2.0.28-preview','count':101,'newAssets':{f'{k[0]}|{k[1]}':v for k,v in local.items()}},indent=2),'utf-8')
          q=p.read_text('utf-8'); assert '.spriteCell img{width:74px;height:74px;' in q; assert '.familyHero img{width:86px;height:86px;' in q
          assert 'Dash Sprite' in q and 'Superman Sprite' in q; assert "const C7S3_VARIANTS=['Base','Gold','Gummy','Galaxy','Holofoil','Cube','Quack','Gem']" in q
          assert not re.search(r'(?:src|image)["\':= ]+https?://',q,re.I), 'external runtime image dependency found'
          print('PREVIEW QA PASS: 101 C7S4 entries; 40 local new assets; dimensions preserved')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2.0.28-preview.html v2.0.28-preview-manifest.json assets/preview-v2028
          git commit -m 'preview: Sprite Collection Locker v2.0.28 expanded 101-entry board'
          git push origin HEAD:main
