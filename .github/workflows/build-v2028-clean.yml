name: Build v2.0.28 clean
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-v2028-clean.yml']
permissions: {contents: write}
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          cp v2.0.28-preview.html v2.0.28.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('v2.0.28.html');s=p.read_text().replace('Sprite Collection Locker — v2.0.28 PREVIEW','Sprite Collection Locker — v2.0.28').replace('v2.0.28-preview','v2.0.28')
          for i in ('v2028-c7s4','v2028-production-layout','v2028-native-extension'):
              s=re.sub(r'<style id="'+i+r'">.*?</style>','',s,flags=re.S)
          for i in ('v2028-season-hook','v2028-production-hook','v2028-native-hook'):
              s=re.sub(r'<script id="'+i+r'">.*?</script>','',s,flags=re.S)
          # C7S4 only: preserve the page's proven responsive variables and overflow behaviour,
          # changing only the number of variant lanes. C7S3 selectors/rules/data remain untouched.
          css='''<style id="v2028-c7s4-lanes">:root{--bounty:#ff4fc8}.v-Bounty{color:var(--bounty)}body.season-c7s4 .variantLegend,body.season-c7s4 .familyRow{grid-template-columns:var(--family-col) repeat(var(--c7s4-cols),var(--variant-col))!important;min-width:calc(var(--family-col) + (var(--c7s4-cols) * var(--variant-col)) + 28px)!important}</style>'''
          hook='''<script id="v2028-c7s4-hook">(()=>{function sync(){const a=[...document.querySelectorAll('.tab.active')].find(x=>/C7S[34]/.test(x.textContent));const on=!!a&&a.textContent.trim()==='C7S4';document.body.classList.toggle('season-c7s4',on);if(!on)return;const rows=[...document.querySelectorAll('.familyRow')].filter(x=>x.offsetParent!==null),legend=[...document.querySelectorAll('.variantLegend')].find(x=>x.offsetParent!==null);if(!legend)return;document.body.style.setProperty('--c7s4-cols',String(Math.max(legend.children.length-1,...rows.map(r=>Math.max(0,r.children.length-1)))))}document.addEventListener('click',()=>setTimeout(sync,0),true);addEventListener('resize',()=>requestAnimationFrame(sync));if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',sync);else sync()})();</script>'''
          s=re.sub(r'<style id="v2028-c7s4-lanes">.*?</style>','',s,flags=re.S);s=re.sub(r'<script id="v2028-c7s4-hook">.*?</script>','',s,flags=re.S)
          p.write_text(s.replace('</body>',css+hook+'</body>',1))
          PY
          npm init -y >/dev/null 2>&1; npm install playwright@1.55.0 >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > qa.js <<'JS'
          const{chromium}=require('playwright'),path=require('path');const u=f=>'file://'+path.join(process.cwd(),f);async function click(p,s){await p.getByRole('button',{name:s,exact:true}).click();await p.waitForTimeout(400)}async function snap(p){return p.evaluate(()=>{let t=document.querySelector('.variantTable'),l=[...document.querySelectorAll('.variantLegend')].find(x=>x.offsetParent!==null),r=[...document.querySelectorAll('.familyRow')].find(x=>x.offsetParent!==null),c=x=>getComputedStyle(x),rect=x=>{let b=x.getBoundingClientRect();return{x:Math.round(b.x),w:Math.round(b.width)}};return{table:{overflowX:c(t).overflowX},legend:{display:c(l).display,padding:c(l).padding,position:c(l).position,cols:c(l).gridTemplateColumns,kids:[...l.children].map(rect)},row:{display:c(r).display,padding:c(r).padding,cols:c(r).gridTemplateColumns,kids:[...r.children].map(rect)}}})};(async()=>{let b=await chromium.launch({headless:true});for(const v of [[393,852,'portrait'],[852,393,'landscape'],[1024,768,'tablet'],[1440,900,'desktop']]){let base=await b.newPage({viewport:{width:v[0],height:v[1]}}),p=await b.newPage({viewport:{width:v[0],height:v[1]}});await base.goto(u('index.html'));await p.goto(u('v2.0.28.html'));await click(base,'C7S3');await click(p,'C7S3');let a=await snap(base),z=await snap(p);if(JSON.stringify(a)!==JSON.stringify(z))throw Error(v[2]+' C7S3 regression');await click(p,'C7S4');let g=await snap(p);if(g.legend.cols!==g.row.cols)throw Error(v[2]+' legend/row grid mismatch '+g.legend.cols+' <> '+g.row.cols);if(g.table.overflowX!==a.table.overflowX||g.legend.display!==a.legend.display||g.row.display!==a.row.display||g.legend.padding!==a.legend.padding||g.row.padding!==a.row.padding||g.legend.position!==a.legend.position)throw Error(v[2]+' C7S4 native behaviour mismatch');let lk=g.legend.kids.slice(1),rk=g.row.kids.slice(1);for(let i=0;i<Math.min(lk.length,rk.length);i++)if(lk[i].x!==rk[i].x||lk[i].w!==rk[i].w)throw Error(v[2]+' lane '+i+' misalign');let bad=await p.evaluate(()=>!!document.querySelector('#v2028-production-layout,#v2028-c7s4,#v2028-production-hook,#v2028-season-hook,#v2028-native-extension,#v2028-native-hook'));if(bad)throw Error(v[2]+' legacy patch remains');let badges=await p.locator('.versionBadge').allInnerTexts().catch(()=>[]);if(badges.some(x=>/preview/i.test(x)))throw Error(v[2]+' preview badge');await p.screenshot({path:'qa-v2028-'+v[2]+'.png',fullPage:true});console.log('PASS',v[2],g.legend.cols)}await b.close()})()
          JS
          node qa.js
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          s=Path('v2.0.28.html').read_text();R=[json.loads(x) for x in re.findall(r'\{[^{}]*"id"\s*:\s*\d+[^{}]*\}',s) if '"variantKey"' in x and '"image"' in x];C=[r for r in R if r.get('season')=='C7S4'];assert len(C)==101
          B=[r for r in C if r.get('variantKey')=='Bounty'];assert len(B)==20 and len({r['image'] for r in B})==20
          for r in C: assert not str(r.get('image','')).startswith(('http://','https://','//')) and Path(r['image']).is_file()
          print('PASS data/assets',len(C),len(B))
          PY
          cp v2.0.28.html index.html;rm -rf node_modules package.json package-lock.json qa.js
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html v2.0.28.html qa-v2028-portrait.png qa-v2028-landscape.png qa-v2028-tablet.png qa-v2028-desktop.png;git commit -m 'release: v2.0.28 native responsive C7S4 lanes';git push origin HEAD:main
