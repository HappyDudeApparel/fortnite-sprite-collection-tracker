name: Build v2.0.28 clean
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-v2028-clean.yml']
permissions: {contents: write}
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          cp v2.0.28-preview.html v2.0.28.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('v2.0.28.html');s=p.read_text().replace('Sprite Collection Locker — v2.0.28 PREVIEW','Sprite Collection Locker — v2.0.28').replace('v2.0.28-preview','v2.0.28')
          # Remove every prior experimental C7S4 geometry patch. Native table CSS remains authority.
          for i in ('v2028-c7s4','v2028-production-layout'):
              s=re.sub(r'<style id="'+i+r'">.*?</style>','',s,flags=re.S)
          for i in ('v2028-season-hook','v2028-production-hook'):
              s=re.sub(r'<script id="'+i+r'">.*?</script>','',s,flags=re.S)
          # Only extend native C7S3 grid column count for C7S4. No alternate overflow/container/row sizing system.
          css='''<style id="v2028-native-extension">:root{--bounty:#ff4fc8}.v-Bounty{color:var(--bounty)}body.season-c7s4 .variantLegend,body.season-c7s4 .familyRow{grid-template-columns:minmax(230px,320px) repeat(var(--c7s4-cols),minmax(62px,1fr))}</style>'''
          hook='''<script id="v2028-native-hook">(()=>{function sync(){const a=[...document.querySelectorAll('.tab.active')].find(x=>/C7S[34]/.test(x.textContent));const on=!!a&&a.textContent.trim()==='C7S4';document.body.classList.toggle('season-c7s4',on);if(!on)return;const rows=[...document.querySelectorAll('.familyRow')].filter(x=>x.offsetParent!==null),legend=[...document.querySelectorAll('.variantLegend')].find(x=>x.offsetParent!==null);if(!legend)return;const cols=Math.max(legend.children.length-1,...rows.map(r=>Math.max(0,r.children.length-1)));document.body.style.setProperty('--c7s4-cols',String(cols))}document.addEventListener('click',()=>setTimeout(sync,0),true);addEventListener('resize',()=>requestAnimationFrame(sync));if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',sync);else sync()})();</script>'''
          s=re.sub(r'<style id="v2028-native-extension">.*?</style>','',s,flags=re.S);s=re.sub(r'<script id="v2028-native-hook">.*?</script>','',s,flags=re.S)
          p.write_text(s.replace('</body>',css+hook+'</body>',1))
          PY
          npm init -y >/dev/null 2>&1; npm install playwright@1.55.0 >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > qa.js <<'JS'
          const{chromium}=require('playwright'),path=require('path');const u=f=>'file://'+path.join(process.cwd(),f);async function click(p,s){await p.getByRole('button',{name:s,exact:true}).click();await p.waitForTimeout(400)}async function geom(p){return p.evaluate(()=>{let t=document.querySelector('.variantTable'),l=[...document.querySelectorAll('.variantLegend')].find(x=>x.offsetParent!==null),r=[...document.querySelectorAll('.familyRow')].find(x=>x.offsetParent!==null);let cs=x=>{let c=getComputedStyle(x);return{overflowX:c.overflowX,display:c.display,padding:c.padding,position:c.position}};return{table:cs(t),legend:cs(l),row:cs(r),legendCols:getComputedStyle(l).gridTemplateColumns,rowCols:getComputedStyle(r).gridTemplateColumns,scroll:t.scrollWidth,client:t.clientWidth}})};(async()=>{let b=await chromium.launch({headless:true});for(const v of [[393,852,'portrait'],[852,393,'landscape'],[1024,768,'tablet'],[1440,900,'desktop']]){let base=await b.newPage({viewport:{width:v[0],height:v[1]}}),p=await b.newPage({viewport:{width:v[0],height:v[1]}});await base.goto(u('index.html'));await p.goto(u('v2.0.28.html'));await click(base,'C7S3');await click(p,'C7S3');let a=await geom(base),z=await geom(p);if(JSON.stringify(a)!==JSON.stringify(z))throw Error(v[2]+' C7S3 changed');await click(p,'C7S4');let g=await geom(p);if(g.legendCols!==g.rowCols)throw Error(v[2]+' legend/row grid mismatch');if(g.table.overflowX!==a.table.overflowX||g.legend.display!==a.legend.display||g.row.display!==a.row.display||g.legend.padding!==a.legend.padding||g.row.padding!==a.row.padding)throw Error(v[2]+' C7S4 not native-layout parity');let bad=await p.evaluate(()=>!!document.querySelector('#v2028-production-layout,#v2028-c7s4,#v2028-production-hook,#v2028-season-hook'));if(bad)throw Error(v[2]+' legacy patch remains');let badges=await p.locator('.versionBadge').allInnerTexts().catch(()=>[]);if(badges.some(x=>/preview/i.test(x)))throw Error(v[2]+' preview badge');await p.screenshot({path:'qa-v2028-'+v[2]+'.png',fullPage:true});console.log('PASS',v[2],g.legendCols)}await b.close()})()
          JS
          node qa.js
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          s=Path('v2.0.28.html').read_text();R=[json.loads(x) for x in re.findall(r'\{[^{}]*"id"\s*:\s*\d+[^{}]*\}',s) if '"variantKey"' in x and '"image"' in x];C=[r for r in R if r.get('season')=='C7S4'];assert len(C)==101;B=[r for r in C if r.get('variantKey')=='Bounty'];assert len(B)==20 and len({r['image'] for r in B})==20
          for r in C: assert not str(r.get('image','')).startswith(('http://','https://','//')) and Path(r['image']).is_file()
          print('PASS data/assets',len(C),len(B))
          PY
          cp v2.0.28.html index.html;rm -rf node_modules package.json package-lock.json qa.js
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html v2.0.28.html qa-v2028-portrait.png qa-v2028-landscape.png qa-v2028-tablet.png qa-v2028-desktop.png;git commit -m 'release: v2.0.28 native responsive C7S4 table';git push origin HEAD:main
