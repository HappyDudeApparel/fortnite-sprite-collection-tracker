name: Build v2.0.28 clean
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-v2028-clean.yml']
permissions: {contents: write}
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1; npm install playwright@1.55.0 >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > audit.js <<'JS'
          const{chromium}=require('playwright'),fs=require('fs'),path=require('path');const u='file://'+path.join(process.cwd(),'index.html');(async()=>{let b=await chromium.launch({headless:true}),out={};for(const v of [[393,852,'portrait'],[852,393,'landscape'],[1024,768,'tablet'],[1440,900,'desktop']]){let p=await b.newPage({viewport:{width:v[0],height:v[1]}});await p.goto(u);await p.getByRole('button',{name:'C7S3',exact:true}).click();await p.waitForTimeout(500);out[v[2]]=await p.evaluate(()=>[...document.querySelectorAll('.familyRow')].filter(r=>r.offsetParent!==null).map(r=>({family:r.querySelector('.familyName')?.textContent.trim(),sprites:[...r.querySelectorAll('.spriteCell')].map(c=>{let i=c.querySelector('img'),ir=i?.getBoundingClientRect(),cr=c.getBoundingClientRect(),cs=getComputedStyle(c);return{src:i?.getAttribute('src'),mastered:c.classList.contains('mastered'),cell:[Math.round(cr.x),Math.round(cr.y),Math.round(cr.width),Math.round(cr.height)],img:ir?[Math.round(ir.x),Math.round(ir.y),Math.round(ir.width),Math.round(ir.height)]:null,crown:cs.getPropertyValue('--none')}})}));await p.screenshot({path:'audit-c7s3-'+v[2]+'.png',fullPage:true});await p.close()}fs.writeFileSync('audit-c7s3.json',JSON.stringify(out,null,2));await b.close()})()
          JS
          node audit.js
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json,statistics
          d=json.load(open('audit-c7s3.json')); seen={}
          for rows in d.values():
            for r in rows:
              for s in r['sprites']:
                src=s.get('src')
                if not src or src in seen or not Path(src).is_file(): continue
                im=Image.open(src).convert('RGBA'); a=im.getchannel('A'); box=a.getbbox()
                if not box: continue
                W,H=im.size; x0,y0,x1,y1=box; seen[src]={'family':r['family'],'W':W,'H':H,'visibleW':x1-x0,'visibleH':y1-y0,'fillW':round((x1-x0)/W,4),'fillH':round((y1-y0)/H,4),'topPad':round(y0/H,4),'rightPad':round((W-x1)/W,4)}
          vals=[x['fillH'] for x in seen.values()]; med=statistics.median(vals) if vals else 0
          report={'count':len(seen),'medianFillH':med,'assets':seen}
          Path('audit-c7s3-visible-bounds.json').write_text(json.dumps(report,indent=2))
          print('C7S3 assets',len(seen),'median visible-height fill',med)
          for k,x in sorted(seen.items(),key=lambda kv:kv[1]['fillH']): print(x['family'],x['fillH'],k)
          PY
          rm -rf node_modules package.json package-lock.json audit.js audit-c7s3.json
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit-c7s3-visible-bounds.json audit-c7s3-portrait.png audit-c7s3-landscape.png audit-c7s3-tablet.png audit-c7s3-desktop.png
          git commit -m 'qa: record C7S3 sprite bounds baseline';git push origin HEAD:main
