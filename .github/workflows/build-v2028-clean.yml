name: Build v2.0.28 clean
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-v2028-clean.yml']
permissions: {contents: write}
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          cp v2.0.28-preview.html v2.0.28.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('v2.0.28.html');s=p.read_text().replace('Sprite Collection Locker — v2.0.28 PREVIEW','Sprite Collection Locker — v2.0.28').replace('v2.0.28-preview','v2.0.28')
          s=re.sub(r'<style id="v2028-c7s4">.*?</style>','',s,flags=re.S);s=re.sub(r'<script id="v2028-season-hook">.*?</script>','',s,flags=re.S)
          css='''<style id="v2028-production-layout">:root{--bounty:#ff4fc8}.v-Bounty{color:var(--bounty)}body.season-c7s4 .variantTable{overflow-x:auto!important;overflow-y:hidden!important;-webkit-overflow-scrolling:touch}body.season-c7s4 .variantLegend,body.season-c7s4 .familyRow{display:grid!important;grid-template-columns:var(--c7s4-hero) repeat(var(--c7s4-cols),var(--c7s4-cell))!important;grid-template-rows:auto!important;grid-auto-flow:row!important;gap:0!important;min-width:calc(var(--c7s4-hero) + var(--c7s4-cols)*var(--c7s4-cell))!important;width:max(100%,calc(var(--c7s4-hero) + var(--c7s4-cols)*var(--c7s4-cell)))!important;align-items:stretch!important}body.season-c7s4 .variantLegend{padding-left:0!important;padding-right:0!important}body.season-c7s4 .variantLegend>*{box-sizing:border-box!important;min-width:0!important;margin:0!important;justify-self:stretch!important;align-self:center!important}body.season-c7s4 .variantLegend>*:first-child{grid-column:1!important;width:var(--c7s4-hero)!important}body.season-c7s4 .variantLegend>*:not(:first-child){width:var(--c7s4-cell)!important;min-width:var(--c7s4-cell)!important;max-width:var(--c7s4-cell)!important;display:flex!important;justify-content:center!important;align-items:center!important;white-space:nowrap!important}body.season-c7s4 .familyRow>*{min-width:0!important;grid-row:1!important}body.season-c7s4 .familyHero{grid-column:1!important;width:var(--c7s4-hero)!important;align-self:stretch!important}body.season-c7s4 .spriteCell,body.season-c7s4 .spriteCell.missing,body.season-c7s4 .emptyCell{box-sizing:border-box!important;width:var(--c7s4-cell)!important;min-width:var(--c7s4-cell)!important;max-width:var(--c7s4-cell)!important;margin-left:0!important;margin-right:0!important;justify-self:stretch!important;align-self:stretch!important}body.season-c7s4 .spriteCell{height:auto!important;min-height:104px!important;display:flex!important;flex-direction:column!important;justify-content:center!important;align-items:center!important}</style>'''
          hook='''<script id="v2028-production-hook">(()=>{function sync(){const a=[...document.querySelectorAll('.tab.active')].find(x=>/C7S[34]/.test(x.textContent)),on=!!a&&a.textContent.trim()==='C7S4';document.body.classList.toggle('season-c7s4',on);if(!on)return;const mobile=innerWidth<=760,cell=mobile?64:88,rows=[...document.querySelectorAll('.familyRow')].filter(x=>x.offsetParent!==null),legend=[...document.querySelectorAll('.variantLegend')].find(x=>x.offsetParent!==null);if(!rows.length||!legend)return;const rr=rows[0].getBoundingClientRect(),first=rows[0].children[1]?.getBoundingClientRect(),hero=Math.round((first?first.x:rr.x+(mobile?230:320))-rr.x),cols=Math.max(legend.children.length-1,...rows.map(r=>Math.max(0,r.children.length-1)));document.body.style.setProperty('--c7s4-hero',hero+'px');document.body.style.setProperty('--c7s4-cell',cell+'px');document.body.style.setProperty('--c7s4-cols',String(cols))}document.addEventListener('click',()=>setTimeout(sync,0),true);addEventListener('resize',()=>requestAnimationFrame(sync));if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',sync);else sync()})();</script>'''
          s=re.sub(r'<style id="v2028-production-layout">.*?</style>','',s,flags=re.S);s=re.sub(r'<script id="v2028-production-hook">.*?</script>','',s,flags=re.S);p.write_text(s.replace('</body>',css+hook+'</body>',1))
          PY
          npm init -y >/dev/null 2>&1; npm install playwright@1.55.0 >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > qa.js <<'JS'
          const{chromium}=require('playwright'),path=require('path');const u=f=>'file://'+path.join(process.cwd(),f);async function click(p,s){await p.getByRole('button',{name:s,exact:true}).click();await p.waitForTimeout(500)}async function rows(p){return p.evaluate(()=>[...document.querySelectorAll('.familyRow')].filter(x=>x.offsetParent!==null).map(r=>({kids:[...r.children].map(x=>{let b=x.getBoundingClientRect();return{x:Math.round(b.x),y:Math.round(b.y),w:Math.round(b.width)}})})))};(async()=>{let b=await chromium.launch({headless:true});for(const v of [[393,852,'portrait',64],[852,393,'landscape',88],[1440,900,'desktop',88]]){let o=await b.newPage({viewport:{width:v[0],height:v[1]}}),p=await b.newPage({viewport:{width:v[0],height:v[1]}});await o.goto(u('index.html'));await p.goto(u('v2.0.28.html'));await click(o,'C7S3');await click(p,'C7S3');if(JSON.stringify(await rows(o))!==JSON.stringify(await rows(p)))throw Error(v[2]+' C7S3 regression');await click(p,'C7S4');let c=await rows(p);if(!c.length)throw Error(v[2]+' no C7S4 rows');let L=await p.evaluate(()=>{let l=[...document.querySelectorAll('.variantLegend')].find(x=>x.offsetParent!==null);return[...l.children].map(x=>{let b=x.getBoundingClientRect();return{x:Math.round(b.x),w:Math.round(b.width)}})});let first=c[0].kids.slice(1);for(let i=1;i<L.length&&i-1<first.length;i++){if(L[i].x!==first[i-1].x||L[i].w!==first[i-1].w)throw Error(v[2]+' legend misalign '+i+' legend '+L[i].x+'/'+L[i].w+' row '+first[i-1].x+'/'+first[i-1].w)}for(let i=0;i<c.length;i++){let z=c[i].kids.slice(1);if(!z.length)continue;let ys=z.map(q=>q.y);if(Math.max(...ys)-Math.min(...ys)>2)throw Error(v[2]+' wrap '+i);for(let j=1;j<z.length;j++)if(z[j].x-z[j-1].x!==v[3])throw Error(v[2]+' spacing '+i+' '+(z[j].x-z[j-1].x));for(const q of z)if(q.w!==v[3])throw Error(v[2]+' cell width '+i+' '+q.w)}let badges=await p.locator('.versionBadge').allInnerTexts().catch(()=>[]);if(badges.some(x=>/preview/i.test(x)))throw Error(v[2]+' rendered preview badge remains');await p.screenshot({path:'qa-v2028-'+v[2]+'.png',fullPage:true});console.log('PASS',v[2]);await o.close();await p.close()}await b.close()})()
          JS
          node qa.js
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          s=Path('v2.0.28.html').read_text();R=[json.loads(x) for x in re.findall(r'\{[^{}]*"id"\s*:\s*\d+[^{}]*\}',s) if '"variantKey"' in x and '"image"' in x];C=[r for r in R if r.get('season')=='C7S4'];assert len(C)==101;B=[r for r in C if r.get('variantKey')=='Bounty'];assert len(B)==20 and len({r['image'] for r in B})==20
          for r in C: assert not str(r.get('image','')).startswith(('http://','https://','//')) and Path(r['image']).is_file()
          print('PASS data/assets',len(C),len(B))
          PY
          cp v2.0.28.html index.html;rm -rf node_modules package.json package-lock.json qa.js
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html v2.0.28.html qa-v2028-portrait.png qa-v2028-landscape.png qa-v2028-desktop.png;git commit -m 'release: v2.0.28 aligned C7S4 legend';git push origin HEAD:main
