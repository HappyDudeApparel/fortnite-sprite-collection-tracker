name: Inspect C7S4 live dataset
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-v2028-clean.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          s=Path('index.html').read_text(encoding='utf-8')
          rec=[]
          for x in re.findall(r'\{[^{}]*"id"\s*:\s*\d+[^{}]*\}',s):
            if '"variantKey"' not in x or '"image"' not in x: continue
            try:r=json.loads(x)
            except:continue
            if r.get('season')=='C7S4': rec.append(r)
          print('C7S4_COUNT',len(rec))
          for r in rec:
            print('REC',json.dumps(r,separators=(',',':'),ensure_ascii=False))
          print('BIRTHDAY',sum('birthday' in str(r.get('name','')).lower() or 'birthday' in str(r.get('family','')).lower() for r in rec))
          print('MORGANA',sum('morgana' in str(r.get('name','')).lower() or 'morgana' in str(r.get('family','')).lower() for r in rec))
          print('BOUNTY',sum(r.get('variantKey')=='Bounty' for r in rec))
          print('REMOTE_IMAGES',sum(str(r.get('image','')).startswith(('http://','https://','//')) for r in rec))
          PY
