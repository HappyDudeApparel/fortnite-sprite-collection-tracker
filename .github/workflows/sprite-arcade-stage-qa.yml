name: Sprite Arcade staging gameplay QA
on:
  push:
    branches: [main]
    paths:
      - 'preview/collectors-vault/arcade/**'
      - 'preview/collectors-vault/index.html'
      - 'preview/collectors-vault/vault.js'
      - 'preview/collectors-vault/vault.css'
      - 'games/**'
      - 'index.html'
      - 'version.json'
      - '.github/workflows/sprite-arcade-stage-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arcade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install browser runner
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Test source preservation, staging page, script syntax and live app isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,json,re,subprocess,tempfile
          root=pathlib.Path('preview/collectors-vault/arcade')
          stage=pathlib.Path('preview/collectors-vault/index.html').read_text()
          original=pathlib.Path('index.html').read_text()
          assert "const APP_VERSION='2.0.45'" in original
          # Staging page: original look + exactly one entry point to the games.
          assert 'playGamesBtn' in stage and 'href="/preview/collectors-vault/arcade/"' in stage
          assert 'data-tab="arcade"' not in stage and 'id="arcadeView"' not in stage and 'lockerPlaySelected' not in stage
          assert '2.1.0-preview' in stage and 'navigator.serviceWorker.register' not in stage
          hub=(root/'index.html').read_text()
          assert 'href="2d/"' in hub and 'href="3d/"' in hub
          game2d=(root/'2d/index.html').read_text()
          untouched2d=(root/'source-original/Sprite-Game-Preview-v0.3.html').read_text()
          untouched3d=(root/'source-original/Sprite-3D-Arena-Visual-Upgrade-v0.2.html').read_text()
          assert len(untouched2d)>280000 and len(untouched3d)>590000
          a=lambda s:s[s.index('const CHARACTERS = ')+len('const CHARACTERS = '):s.index(';',s.index('const CHARACTERS = '))]
          assert a(game2d)==a(untouched2d),'Original 18 playable character records changed'
          assert 'function drawPuppetSprite' in game2d and 'window.ARCADE_LOCKER_SPRITE' in game2d
          catalog=json.loads((root/'catalog.json').read_text())
          assert len(catalog['entries'])==279 and len([x for x in catalog['entries'] if x['player2d']])==97
          # 3D: required files, and no Gamer Bros code identifiers.
          for f in ['index.html','js/main.js','js/sim.js','js/rules.js','js/levels.js','js/world.js','js/actors.js','assets/characters/citrus.glb','assets/kenney/Textures/colormap.png','vendor/three/three.module.min.js']:
            assert (root/'3d'/f).exists(),'missing 3D file '+f
          for f in (root/'3d/js').glob('*.js'):
            t=f.read_text()
            assert 'GB_RUMBLER' not in t and 'BP_GamerBro' not in t,f
          # Production: Play Sprite Games button + self-contained games/ folder.
          assert 'playGamesBtn' in original and 'href="/games/"' in original
          prod=pathlib.Path('games')
          for f in ['index.html','catalog.json','2d/index.html','2d/levels.js','3d/index.html','3d/js/main.js','3d/js/look.js','3d/assets/characters/citrus.glb','3d/vendor/three/three.module.min.js']:
            assert (prod/f).exists(),'missing production file games/'+f
          assert 'Staging' not in (prod/'index.html').read_text() and 'Staging' not in (prod/'3d/index.html').read_text()
          # Production root: only the approved release files differ from the v2.0.45 release commit.
          base='1da9eac49ea70eff7aca53b3c57a8cce891f4b61'
          for path in ['index.html','version.json','service-worker.js','asset-manifest.json']:
            assert subprocess.check_output(['git','show',base+':'+path])==pathlib.Path(path).read_bytes(),path
          # Manifest: only start_url may differ from the release commit; the installed-app id must never change.
          old_manifest=json.loads(subprocess.check_output(['git','show',base+':manifest.webmanifest']))
          cur_manifest=json.loads(pathlib.Path('manifest.webmanifest').read_text(encoding='utf8'))
          assert cur_manifest['id']==old_manifest['id']=='./sprite-collection-locker-v2.0.30','PWA id must stay stable'
          assert cur_manifest.pop('start_url')=='./index.html?v=2.0.45','start_url must match APP_VERSION 2.0.45'
          old_manifest.pop('start_url')
          assert old_manifest==cur_manifest,'manifest changed beyond start_url'
          match=re.search(r'<script>([\s\S]*?)</script>',game2d)
          assert match, 'Missing embedded 2D script'
          with tempfile.NamedTemporaryFile(mode='w',suffix='.js') as tmp:
            tmp.write(match.group(1));tmp.flush()
            subprocess.run(['node','--check',tmp.name],check=True)
          files=[root/'2d/levels.js',root/'2d/themes.js',root/'tools/validate-levels.js',root/'tools/validate-3d-levels.mjs',pathlib.Path('preview/collectors-vault/vault.js')]+sorted((root/'3d/js').glob('*.js'))
          for path in files: subprocess.run(['node','--check',str(path)],check=True)
          print('PASS: originals preserved, staging page simplified, all game JS parses, root production files protected')
          PY
      - name: Prove every 2D level is completable (physics replay of tube + every gem)
        run: node preview/collectors-vault/arcade/tools/validate-levels.js
      - name: Prove every 3D world is completable (same physics file the game runs)
        run: node preview/collectors-vault/arcade/tools/validate-3d-levels.mjs
      - name: 3D fairness rules (landing sizes, monster-free landing pockets, safe knockback) and mutation tests
        run: |
          node preview/collectors-vault/arcade/tools/validate-3d-levels.mjs --mutate
          node preview/collectors-vault/arcade/tools/test-3d-rules.mjs
      - name: Browser QA of 3D fairness (landing pockets, knockback, Dash)
        run: python preview/collectors-vault/arcade/tools/qa-3d-fairness.py
      - name: Play test staging page, hub, 2D and 3D (mobile and desktop)
        shell: bash
        run: |
          python - <<'PY'
          import threading,http.server
          from playwright.sync_api import sync_playwright
          server=http.server.ThreadingHTTPServer(('127.0.0.1',8899),http.server.SimpleHTTPRequestHandler)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          B='http://127.0.0.1:8899'
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=['--no-sandbox','--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist'])
            for label,size in [('desktop',{'width':1440,'height':900}),('phone',{'width':390,'height':844})]:
              context=browser.new_context(viewport=size,device_scale_factor=1)
              page=context.new_page();errs=[];page.on('pageerror',lambda e:errs.append(str(e)))
              page.goto(B+'/preview/collectors-vault/',wait_until='domcontentloaded',timeout=60000)
              page.wait_for_selector('body[data-vault-ready="true"]',timeout=30000)
              play=page.locator('a.playGamesBtn:visible').first
              assert play.is_visible()
              assert page.locator('button[data-tab="arcade"]').count()==0
              play.click()
              page.wait_for_url('**/arcade/',timeout=10000)
              assert page.locator('a.card').count()==2
              page.screenshot(path='preview/collectors-vault/arcade/qa-hub-'+label+'.png')
              page.locator('a.card.d2').click()
              page.wait_for_url('**/arcade/2d/',timeout=10000)
              page.wait_for_function("typeof mode!=='undefined'&&mode==='select'",timeout=30000)
              page.locator('#arcadeBack').click()
              page.wait_for_url('**/arcade/',timeout=10000)
              assert not errs,errs[:5]
              print('PASS',label,'staging page -> Play Sprite Games -> hub -> 2D select -> back')
              two=context.new_page();gameErr=[]
              two.on('pageerror',lambda e:gameErr.append(str(e)))
              two.goto(B+'/preview/collectors-vault/arcade/2d/?sprite=1&autostart=water&level=4',wait_until='load',timeout=60000)
              two.wait_for_function("window.ARCADE_LOCKER_SPRITE&&window.ARCADE_LOCKER_SPRITE.id===1",timeout=30000)
              two.wait_for_function("document.querySelector('#select')?.hidden===true",timeout=30000)
              assert two.evaluate('game&&mode==="game"&&game.player.characterId==="water"&&game.level.id==="cinder-works"')
              start=two.evaluate('game.player.x')
              two.keyboard.down('ArrowRight');two.wait_for_timeout(400);two.keyboard.up('ArrowRight')
              assert two.evaluate('game.player.x')>start+10
              two.locator('#arcadeMove').click()
              assert two.locator('#arcadeMove').get_attribute('aria-pressed')=='false'
              two.keyboard.press('Escape')
              two.wait_for_function("mode==='levels'",timeout=5000)
              assert two.locator('.level-card').count()==5
              assert not gameErr,gameErr[:5]
              print('PASS',label,'2D: Locker autostart, level query, movement, motion toggle, level select')
              three=context.new_page();threeErr=[]
              three.on('pageerror',lambda e:threeErr.append(str(e)))
              three.goto(B+'/preview/collectors-vault/arcade/3d/?autostart=1&level=1&q=2&nointro=1',wait_until='load',timeout=60000)
              three.wait_for_function("window.ARENA&&ARENA.mode==='play'",timeout=120000)
              assert three.evaluate('ARENA.world.gems.length>20&&ARENA.enemies.length>0&&ARENA.world.solids.length>5')
              z0=three.evaluate('ARENA.sim.z')
              three.keyboard.down('KeyW');three.wait_for_timeout(1500);three.keyboard.up('KeyW')
              assert three.evaluate('ARENA.sim.z')<z0-0.5,'3D movement failed'
              three.screenshot(path='preview/collectors-vault/arcade/qa-3d-'+label+'.png')
              assert not threeErr,threeErr[:5]
              print('PASS',label,'3D: world builds, player + enemies load, movement works, no errors')
              prod=context.new_page();perr=[];prod.on('pageerror',lambda e:perr.append(str(e)))
              prod.goto(B+'/',wait_until='domcontentloaded',timeout=60000)
              prod.wait_for_selector('.familyRow[data-family="Honey"]',timeout=30000)
              assert prod.evaluate('countable().length')==162,'production collection changed'
              prod.locator('a.playGamesBtn:visible').first.click()
              prod.wait_for_url('**/games/',timeout=10000)
              assert prod.locator('a.card').count()==2
              prod.goto(B+'/games/3d/?autostart=1&level=2&q=2&nointro=1',wait_until='load',timeout=60000)
              prod.wait_for_function("window.ARENA&&ARENA.mode==='play'&&ARENA.levelIndex===1",timeout=120000)
              assert not perr,perr[:5]
              print('PASS',label,'production: Locker (162 sprites) -> Play Sprite Games -> hub -> /games/3d/ plays')
              for tab in (prod,three,two,page):tab.close()
              context.close()
            browser.close()
          server.shutdown()
          PY
      - name: Verify publicly served staging routes
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,time
          targets=[
            ('https://sprites.happydude.ca/preview/collectors-vault/',{'':'playGamesBtn','arcade/':'SPRITE <span>GAMES','arcade/2d/index.html':'drawPuppetSprite','arcade/2d/levels.js':'SPRITE_LEVELS','arcade/3d/index.html':'js/main.js','arcade/3d/js/levels.js':'sunflower-isles','arcade/catalog.json':'"entries"'}),
            ('https://sprites.happydude.ca/',{'':'playGamesBtn','version.json':'"2.0.45"','games/':'SPRITE <span>GAMES','games/2d/levels.js':'SPRITE_LEVELS','games/3d/js/main.js':'ARENA','games/3d/js/look.js':'styleCitrus','games/3d/js/rules.js':'ARRIVAL_DEPTH','games/catalog.json':'"entries"'}),
          ]
          last=''
          for attempt in range(16):
            try:
              for root,paths in targets:
                for path,token in paths.items():
                  request=urllib.request.Request(root+path+'?arcade-stage-qa=1',headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(request,timeout=23) as r:content=r.read(900000).decode('utf-8')
                  assert token in content,'Stale or missing '+root+path
              print('PASS: staging and production pages, hubs, 2D, 3D and catalogues are publicly accessible')
              break
            except Exception as e:
              last=str(e);print('Waiting for GitHub Pages:',last,flush=True);time.sleep(10)
          else:raise RuntimeError('Staging assets never appeared: '+last)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprite-arcade-staging-screenshots
          path: preview/collectors-vault/arcade/qa-*.png
          if-no-files-found: ignore
