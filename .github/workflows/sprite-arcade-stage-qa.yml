name: Sprite Arcade staging gameplay QA
on:
  push:
    branches: [main]
    paths:
      - 'preview/collectors-vault/arcade/**'
      - 'preview/collectors-vault/index.html'
      - 'preview/collectors-vault/vault.js'
      - '.github/workflows/sprite-arcade-stage-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arcade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install browser runner
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Test source preservation, official game assets, script syntax and live app isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,json,re,subprocess,tempfile
          root=pathlib.Path('preview/collectors-vault/arcade')
          stage=pathlib.Path('preview/collectors-vault/index.html').read_text()
          original=pathlib.Path('index.html').read_text()
          assert "const APP_VERSION='2.0.43'" in original
          assert 'id="arcadeView"' in stage and 'id="lockerPlaySelected"' in stage
          assert 'arcade/arcade.js' in stage and 'arcade/arcade.css' in stage
          assert '2.1.0-preview' in stage and 'navigator.serviceWorker.register' not in stage
          game2d=(root/'2d/index.html').read_text()
          game3d=(root/'3d/index.html').read_text()
          untouched2d=(root/'source-original/Sprite-Game-Preview-v0.3.html').read_text()
          untouched3d=(root/'source-original/Sprite-3D-Arena-Visual-Upgrade-v0.2.html').read_text()
          assert len(untouched2d)>280000 and len(untouched3d)>590000
          a=lambda s:s[s.index('const CHARACTERS = ')+len('const CHARACTERS = '):s.index(';',s.index('const CHARACTERS = '))]
          assert a(game2d)==a(untouched2d),'Original 18 playable character records changed'
          assert 'function drawPuppetSprite' in game2d
          assert "window.ARCADE_LOCKER_SPRITE" in game2d
          assert 'window.ARCADE_3D_SELECTION' in game3d
          assert 'root.add(portrait)' in game3d
          assert "root.traverse(object=>" in game3d
          assert "GB_RUMBLER" not in game3d and "BP_GamerBroBlue" not in game3d
          catalog=json.loads((root/'catalog.json').read_text())
          assert len(catalog['entries'])==279 and len([x for x in catalog['entries'] if x['player2d']])>=117
          # Root remains byte-for-byte unchanged since approved v2.0.43.
          base='45278cd967c230a1d97ec31cb7c2a00d11492139'
          for path in ['index.html','version.json','service-worker.js','manifest.webmanifest','asset-manifest.json']:
            assert subprocess.check_output(['git','show',base+':'+path])==pathlib.Path(path).read_bytes(),path
          for i,source in enumerate([game2d,game3d]):
            match=re.search(r'<script>([\s\S]*?)</script>',source)
            assert match, 'Missing embedded script'
            with tempfile.NamedTemporaryFile(mode='w',suffix='.js') as tmp:
              tmp.write(match.group(1));tmp.flush()
              subprocess.run(['node','--check',tmp.name],check=True)
          for path in [root/'arcade.js',pathlib.Path('preview/collectors-vault/vault.js')]:
            subprocess.run(['node','--check',str(path)],check=True)
          print('PASS: original character data and game archives preserved, all game JS parses, verified asset index, root production files protected')
          PY
      - name: Play test 2D and 3D from Arcade staging (mobile and desktop)
        shell: bash
        run: |
          python - <<'PY'
          import threading,http.server,time,os
          from playwright.sync_api import sync_playwright
          server=http.server.ThreadingHTTPServer(('127.0.0.1',8899),http.server.SimpleHTTPRequestHandler)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=['--no-sandbox','--enable-webgl','--use-gl=angle','--use-angle=swiftshader'])
            for label,size in [('desktop',{'width':1440,'height':900}),('phone',{'width':390,'height':844})]:
              context=browser.new_context(viewport=size,device_scale_factor=1)
              page=context.new_page();errs=[];page.on('pageerror',lambda e:errs.append(str(e)))
              page.goto('http://127.0.0.1:8899/preview/collectors-vault/',wait_until='domcontentloaded',timeout=60000)
              page.wait_for_selector('body[data-vault-ready="true"]',timeout=30000)
              page.locator('button[data-tab="arcade"]').click()
              page.wait_for_selector('#arcadeView.active #arcadeHub .arcade-play',timeout=10000)
              assert page.locator('#arcadeView .arcade-tile').count()==2
              page.locator('#arcade-select').select_option('1')
              href2d=page.locator('#arcade2dLink').get_attribute('href')
              href3d=page.locator('#arcade3dLink').get_attribute('href')
              assert 'sprite=1' in href2d and 'autostart=water' in href2d
              assert 'sprite=1' in href3d
              page.locator('button[data-tab="locker"]').click()
              page.wait_for_selector('#lockerView.active')
              page.locator('#lockerPlaySelected').click()
              page.wait_for_selector('#arcadeView.active')
              page.screenshot(path='preview/collectors-vault/arcade/arcade-hub-'+label+'.png',full_page=False)
              two=context.new_page();gameErr=[]
              two.on('pageerror',lambda e:gameErr.append(str(e)))
              two.goto('http://127.0.0.1:8899'+href2d,wait_until='load',timeout=60000)
              two.wait_for_function("window.ARCADE_LOCKER_SPRITE&&window.ARCADE_LOCKER_SPRITE.id===1",timeout=30000)
              two.wait_for_function("document.querySelector('#select')?.hidden===true",timeout=30000)
              assert two.evaluate('game&&mode==="game"&&game.player.characterId==="water"')
              start=two.evaluate('game.player.x')
              two.keyboard.down('ArrowRight')
              two.wait_for_timeout(400)
              two.keyboard.up('ArrowRight')
              end=two.evaluate('game.player.x')
              assert end>start+10,('2D right motion failed',start,end)
              two.locator('#arcadeMove').click()
              assert two.locator('#arcadeMove').get_attribute('aria-pressed')=='false'
              two.locator('#arcadeMove').click()
              assert two.locator('#arcadeMove').get_attribute('aria-pressed')=='true'
              two.screenshot(path='preview/collectors-vault/arcade/arcade-2d-'+label+'.png',full_page=False)
              assert not gameErr,gameErr[:5]
              print('PASS',label,'2D artwork, Locker autostart, movement, articulated motion toggle')
              three=context.new_page();threeErr=[]
              three.on('pageerror',lambda e:threeErr.append(str(e)))
              three.goto('http://127.0.0.1:8899'+href3d,wait_until='domcontentloaded',timeout=60000)
              three.wait_for_selector('#enterBtn',timeout=30000)
              three.wait_for_function("window.ARCADE_3D_SELECTION && ['ready','fallback'].includes(window.ARCADE_3D_SELECTION.status)",timeout=30000)
              state=three.evaluate('window.ARCADE_3D_SELECTION')
              assert state['id']==1 and state['name'].startswith('Water'),state
              assert state['status']=='ready','Authentic 2.5D character artwork failed: '+str(state)
              three.locator('#enterBtn').click()
              assert three.locator('#intro').evaluate('(e)=>e.classList.contains("hidden")')
              three.wait_for_timeout(700)
              assert three.locator('#gameCanvas').count()==1
              assert three.locator('#arcade3DSpriteHud img').evaluate('(i)=>i.complete&&i.naturalWidth>0')
              three.screenshot(path='preview/collectors-vault/arcade/arcade-3d-'+label+'.png',full_page=False)
              assert not threeErr,threeErr[:5]
              print('PASS',label,'3D WebGL boot, selected authentic Sprite avatar, gameplay entered')
              for tab in (three,two,page):tab.close()
              context.close()
            browser.close()
          server.shutdown()
          PY
      - name: Verify publicly served staging game routes
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,time
          root='https://sprites.happydude.ca/preview/collectors-vault/'
          paths={'':'id="arcadeView"','arcade/2d/index.html':'drawPuppetSprite','arcade/3d/index.html':'ARCADE_3D_SELECTION','arcade/catalog.json':'"entries"','arcade/arcade.js':'SpriteArcadeStage'}
          last=''
          for attempt in range(16):
            try:
              for path,token in paths.items():
                request=urllib.request.Request(root+path+'?arcade-stage-qa=1',headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'})
                with urllib.request.urlopen(request,timeout=23) as r:content=r.read(800000).decode('utf-8')
                assert token in content,'Stale or missing '+path
              print('PASS: staging launcher, 2D, 3D, catalogue and launcher JS all publicly accessible')
              break
            except Exception as e:
              last=str(e);print('Waiting for GitHub Pages:',last,flush=True);time.sleep(10)
          else:raise RuntimeError('Staging assets never appeared: '+last)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprite-arcade-staging-screenshots
          path: preview/collectors-vault/arcade/arcade-*.png
          if-no-files-found: ignore
