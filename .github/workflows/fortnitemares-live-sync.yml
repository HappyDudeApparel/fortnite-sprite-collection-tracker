name: Fortnitemares live roster sync
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fortnitemares-live-sync.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message || '', '[fortnitemares-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch verified live roster and embed artwork
        run: |
          python - <<'PY'
          import json,re,hashlib,urllib.request,pathlib
          p=pathlib.Path('index.html')
          s=p.read_text(encoding='utf-8')
          m=re.search(r'const SPRITES=(\[.*?\]);\s*\nconst BACKGROUNDS=',s,re.S)
          if not m: raise SystemExit('SPRITES block not found')
          sprites=json.loads(m.group(1))
          if any(x.get('family')=='Spooky Dash' for x in sprites):
              raise SystemExit('Fortnitemares roster already present; refusing duplicate patch')
          asset_dir=pathlib.Path('assets/embedded'); asset_dir.mkdir(parents=True,exist_ok=True)
          families=[
            ('Spooky Dash','Mythic','(Active - Jump In Air) Spooky Dash lets you phase through some objects. Gain charges over time.','Charge cooldown decreases with each Level Up!','PhaseDash'),
            ('Vampire','Legendary','Recover health when damaging an enemy.','Health recovered percent increases with each Level Up!','HealthSiphon'),
            ('The Deer','Legendary','Melee attacks deal more damage.','Melee attack damage increases with each Level Up!','IncreasedMelee'),
            ('Dumpster Dive','Epic','Food provides bonus healing. Find food when jumping out of hiding props, with a small chance when opening containers.','Find better food with each Level Up!','WinnerD'),
          ]
          variants=[
            ('Base','Base',0,'','_L.webp'),
            ('Cheat','Cheat Master',1,'All Cheat Code inputs count as correct','_Cheatmaster_L.webp'),
            ('Hacker','Loot Hacker',2,'Increases chances of spawning items from your Loot Hacks','_Hacker_L.webp'),
            ('Gold','Gold',3,'Gain 3x bonus XP from eliminations','_Gold_L.webp'),
            ('Bounty','Bounty Hunter',4,'Chance to find Sprites when eliminating opponents. Only gains Sprite XP from eliminations, unless Sprite has special XP rules.','_BountyHunter_L.webp'),
          ]
          def embed(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r: data=r.read()
              if len(data)<1000: raise RuntimeError(f'Artwork too small: {url}')
              name=hashlib.sha256(data).hexdigest()[:20]+'.webp'
              out=asset_dir/name
              out.write_bytes(data)
              return 'assets/embedded/'+name
          next_id=max(x['id'] for x in sprites)+1
          std=max(x.get('standardIndex',0) or 0 for x in sprites)+1
          for fam,rarity,desc,levelup,token in families:
              for key,label,order,bonus,suffix in variants:
                  url=f'https://fortnite.gg/img/x/sprites/icons/T_Icon_BR_Creature_Sprite_{token}{suffix}'
                  img=embed(url)
                  name=(fam+' Sprite') if key=='Base' else (label+' '+fam+' Sprite')
                  sprites.append({
                    'id':next_id,'family':fam,'displayFamily':fam,'familyName':fam+' Sprite',
                    'variantKey':key,'variant':label,'variantOrder':order,'name':name,
                    'description':desc,'location':'Pumpkin Chests / current Fortnitemares Sprite ecosystem',
                    'effect':bonus or desc,'rarity':rarity if key=='Base' else 'Special','image':img,
                    'releaseState':'released','summonCost':None,'spriteChestChance':'Not published',
                    'standardIndex':std,'status':'Collectible','preview':False,'countsTowardCollection':True,
                    'levelUp':levelup,'season':'C7S4'
                  })
                  next_id+=1; std+=1
          crown_url='https://fortnite.gg/img/x/sprites/icons/T_Icon_BR_Creature_Sprite_Crown_TrickTreat_L.webp'
          crown_img=embed(crown_url)
          sprites.append({
            'id':next_id,'family':'Crown','displayFamily':'Crown','familyName':'Crown Sprite',
            'variantKey':'Trick','variant':'Trick or Treat','variantOrder':5,'name':'Trick or Treat Crown Sprite',
            'description':'Only levels up by winning matches while equipped. Mastery with 1 win. New variants unlocked after mastering!',
            'location':'Unlocked by mastering Bounty Hunter Crown with a Victory Royale while equipped',
            'effect':'Mastery with 1 win','rarity':'Special','image':crown_img,'releaseState':'released',
            'summonCost':None,'spriteChestChance':'Not published','standardIndex':std,'status':'Collectible',
            'preview':False,'countsTowardCollection':True,'levelUp':'Only levels up by winning matches while equipped; mastery with 1 win.',
            'season':'C7S4'
          })
          block=json.dumps(sprites,separators=(',',':'),ensure_ascii=False)
          s=s[:m.start(1)]+block+s[m.end(1):]
          s=s.replace("const C7S4_VARIANTS=['Base','Cheat','Hacker','Gold','Bounty'];","const C7S4_VARIANTS=['Base','Cheat','Hacker','Gold','Bounty','Trick'];")
          s=s.replace("function variantLabelHtml(v){return `<div class=\"legendItem\"><span class=\"dot v-${v}\"></span><span>${v}</span></div>`}","function variantLabelHtml(v){const label=v==='Cheat'?'Cheat Master':v==='Hacker'?'Loot Hacker':v==='Bounty'?'Bounty Hunter':v==='Trick'?'Trick or Treat':v;return `<div class=\"legendItem\"><span class=\"dot v-${v}\"></span><span>${label}</span></div>`}")
          old="function silhouetteCell(base,fam,variant){if(!base||BASE_ONLY_FAMILIES.includes(fam)||(fam==='Llama'&&variant==='Holofoil'))return '<div class=\"emptyCell\"></div>';"
          new="function silhouetteCell(base,fam,variant){if(!base||variant==='Trick'||BASE_ONLY_FAMILIES.includes(fam)||(fam==='Llama'&&variant==='Holofoil'))return '<div class=\"emptyCell\"></div>';"
          if old not in s: raise SystemExit('silhouetteCell guard not found')
          s=s.replace(old,new,1)
          s=s.replace("const APP_VERSION='2.0.29'","const APP_VERSION='2.0.30'",1)
          s=s.replace('Sprite Collection Locker — v2.0.29','Sprite Collection Locker — v2.0.30',1)
          # Distinct seasonal dot; does not alter C7S3.
          s=s.replace('<style id="v2028-production-layout">','<style id="v2030-fortnitemares">.v-Trick{color:#ff8a2a}.v-Trick.dot{background:radial-gradient(circle at 35% 30%,#ffd86b 0 24%,#ff7a1a 50%,#7d2b08 100%);box-shadow:0 0 12px #ff7a1a}</style><style id="v2028-production-layout">',1)
          p.write_text(s,encoding='utf-8')
          # Hard QA: C7S3 byte-level sprite data subset is unchanged in count and identities; C7S4 exact live totals.
          c7s4=[x for x in sprites if x.get('season')=='C7S4' and x.get('countsTowardCollection') is not False and not x.get('preview') and x.get('status')!='Vaulted']
          fams=[]
          for x in c7s4:
              if x['displayFamily'] not in fams: fams.append(x['displayFamily'])
          assert len(c7s4)==122,(len(c7s4),'expected 122')
          assert len(fams)==25,(len(fams),'expected 25 families')
          counts={k:sum(1 for x in c7s4 if x['variantKey']==k) for k in ['Base','Gold','Cheat','Hacker','Bounty','Trick']}
          assert counts=={'Base':25,'Gold':24,'Cheat':24,'Hacker':24,'Bounty':24,'Trick':1},counts
          assert not any(x['family'] in {'Honey','Obsession'} for x in c7s4)
          assert [x['family'] for x in c7s4 if x['variantKey']=='Trick']==['Crown']
          print('QA PASS:',len(c7s4),'collectibles,',len(fams),'families,',counts)
          # Update manifest versions/assets.
          mp=pathlib.Path('asset-manifest.json')
          manifest=json.loads(mp.read_text())
          manifest['version']='2.0.30'
          manifest['assets']=sorted(str(x).replace('\\','/') for x in pathlib.Path('assets/embedded').iterdir() if x.is_file())
          mp.write_text(json.dumps(manifest,separators=(',',':')),encoding='utf-8')
          wp=pathlib.Path('manifest.webmanifest')
          wm=json.loads(wp.read_text())
          wm['id']='./sprite-collection-locker-v2.0.30'
          wm['start_url']='./index.html?v=2.0.30'
          wp.write_text(json.dumps(wm,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit production update
        run: |
          git config user.name "HappyDudeApparel"
          git config user.email "happydudeapparel@gmail.com"
          git add index.html asset-manifest.json manifest.webmanifest assets/embedded
          git commit -m "feat: Fortnitemares live Sprites 101 to 122 [fortnitemares-sync]"
          git push
