name: Fix and browser-QA v2.0.28 C7S4 rows
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-v2028-preview-v2.yml']
permissions: {contents: write}
jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v2.0.28-preview.html'); s=p.read_text()
          a=s.index('<style id="v2028-c7s4">'); b=s.index('</style>',a)+8
          css='''<style id="v2028-c7s4">:root{--bounty:#ff4fc8}.v-Bounty{color:var(--bounty)}body.season-c7s4 .variantTable{overflow-x:auto!important;overflow-y:hidden!important;-webkit-overflow-scrolling:touch}body.season-c7s4 .variantLegend,body.season-c7s4 .familyRow{grid-template-columns:230px repeat(5,88px)!important;min-width:698px!important;width:698px!important}body.season-c7s4 .familyHero{grid-template-columns:90px 1fr!important;gap:18px!important}body.season-c7s4 .familyHero img{width:86px!important;height:86px!important}body.season-c7s4 .spriteCell{width:88px!important;height:92px!important}body.season-c7s4 .spriteCell img{width:74px!important;height:74px!important}body.season-c7s4 .legendItem{font-size:13px!important;gap:6px!important}body.season-c7s4 .dot{width:12px!important;height:12px!important}@media(min-width:900px){body.season-c7s4 .variantLegend,body.season-c7s4 .familyRow{grid-template-columns:minmax(230px,320px) repeat(5,minmax(88px,1fr))!important;min-width:790px!important;width:100%!important}}</style>'''
          s=s[:a]+css+s[b:]
          hook='''<script id="v2028-season-hook">(()=>{function sync(){const active=[...document.querySelectorAll('.tab.active')].find(x=>/C7S[34]/.test(x.textContent));document.body.classList.toggle('season-c7s4',!!active&&active.textContent.trim()==='C7S4')}document.addEventListener('click',()=>setTimeout(sync,0),true);new MutationObserver(sync).observe(document.documentElement,{subtree:true,attributes:true,attributeFilter:['class']});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',sync);else sync();})();</script>'''
          if 'id="v2028-season-hook"' not in s:s=s.replace('</body>',hook+'</body>',1)
          p.write_text(s)
          PY
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > qa.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const browser=await chromium.launch({headless:true});
          for(const cfg of [{name:'portrait',w:393,h:852},{name:'landscape',w:852,h:393}]){
            const page=await browser.newPage({viewport:{width:cfg.w,height:cfg.h}});await page.goto('file://'+process.cwd()+'/v2.0.28-preview.html');await page.waitForTimeout(500);await page.getByRole('button',{name:'C7S4',exact:true}).click();await page.waitForTimeout(250);
            const audit=await page.evaluate(()=>{const rows=[...document.querySelectorAll('.familyRow')].filter(r=>r.offsetParent!==null);return {classOK:document.body.classList.contains('season-c7s4'),rows:rows.slice(0,15).map(r=>{const b=[...r.children].map(x=>x.getBoundingClientRect());return {n:b.length,h:Math.round(r.getBoundingClientRect().height),cy:b.map(x=>Math.round(x.top+x.height/2)),left:b.map(x=>Math.round(x.left))}})};});
            if(!audit.classOK)throw Error(cfg.name+' class absent');for(const [i,r] of audit.rows.entries()){if(r.n!==6)throw Error(cfg.name+' row '+i+' children='+r.n);if(Math.max(...r.cy)-Math.min(...r.cy)>8)throw Error(cfg.name+' row '+i+' not single-line '+JSON.stringify(r));if(r.h>125)throw Error(cfg.name+' row '+i+' tall='+r.h);for(let j=1;j<r.left.length;j++)if(r.left[j]<=r.left[j-1])throw Error(cfg.name+' row '+i+' order '+JSON.stringify(r));}
            await page.screenshot({path:'qa-'+cfg.name+'.png',fullPage:true});console.log('PASS '+cfg.name,JSON.stringify(audit.rows.slice(0,3)));await page.close();}
          await browser.close();})();
          JS
          node qa.js
          rm -f qa.js package.json package-lock.json
          rm -rf node_modules
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v2.0.28-preview.html qa-portrait.png qa-landscape.png
          git commit -m 'preview: rendered-QA C7S4 single-line rows'
          git push origin HEAD:main
