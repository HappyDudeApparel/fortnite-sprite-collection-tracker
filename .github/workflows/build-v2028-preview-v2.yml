name: Isolate and browser-QA v2.0.28 without C7S3 regression
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-v2028-preview-v2.yml']
permissions: {contents: write}
jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('v2.0.28-preview.html'); s=p.read_text()
          s=re.sub(r'<style id="v2028-c7s4">.*?</style>','',s,flags=re.S); s=re.sub(r'<script id="v2028-season-hook">.*?</script>','',s,flags=re.S)
          # C7S4 only. Force every direct row child into one explicit grid row; overflow scrolls horizontally.
          css='''<style id="v2028-c7s4">:root{--bounty:#ff4fc8}.v-Bounty{color:var(--bounty)}body.season-c7s4 .variantTable{overflow-x:auto!important;overflow-y:hidden!important;-webkit-overflow-scrolling:touch}body.season-c7s4 .variantLegend,body.season-c7s4 .familyRow{display:grid!important;grid-template-columns:320px repeat(var(--c7s4-cols),88px)!important;grid-template-rows:auto!important;grid-auto-flow:column!important;grid-auto-columns:88px!important;min-width:calc(320px + var(--c7s4-cols)*88px)!important;width:max(100%,calc(320px + var(--c7s4-cols)*88px))!important;align-items:stretch!important}body.season-c7s4 .variantLegend>*{min-width:0!important;align-self:center!important}body.season-c7s4 .familyRow>*{min-width:0!important;grid-row:1!important}body.season-c7s4 .familyHero{width:320px!important;display:grid!important;grid-template-columns:86px minmax(0,1fr)!important;gap:18px!important;align-items:center!important;align-self:stretch!important}body.season-c7s4 .familyHero img{width:86px!important;height:86px!important;object-fit:contain!important}body.season-c7s4 .spriteCell{width:88px!important;min-width:88px!important;height:auto!important;min-height:104px!important;display:flex!important;flex-direction:column!important;justify-content:center!important;align-items:center!important;align-self:stretch!important}body.season-c7s4 .spriteCell img{width:74px!important;height:74px!important;object-fit:contain!important}@media(max-width:760px){body.season-c7s4 .variantLegend,body.season-c7s4 .familyRow{grid-template-columns:230px repeat(var(--c7s4-cols),88px)!important;min-width:calc(230px + var(--c7s4-cols)*88px)!important;width:calc(230px + var(--c7s4-cols)*88px)!important}body.season-c7s4 .familyHero{width:230px!important;grid-template-columns:86px 126px!important}}</style>'''
          hook='''<script id="v2028-season-hook">(()=>{function sync(){const a=[...document.querySelectorAll('.tab.active')].find(x=>/C7S[34]/.test(x.textContent));const on=!!a&&a.textContent.trim()==='C7S4';document.body.classList.toggle('season-c7s4',on);if(on){const rows=[...document.querySelectorAll('.familyRow')].filter(x=>x.offsetParent!==null);const n=Math.max(0,...rows.map(r=>Math.max(0,r.children.length-1)));document.body.style.setProperty('--c7s4-cols',String(n))}else document.body.style.removeProperty('--c7s4-cols')}document.addEventListener('click',()=>setTimeout(sync,0),true);new MutationObserver(()=>setTimeout(sync,0)).observe(document.documentElement,{subtree:true,attributes:true,attributeFilter:['class']});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',sync);else sync()})();</script>'''
          s=s.replace('</body>',css+hook+'</body>',1); p.write_text(s)
          q=Path('QA.md'); qt=q.read_text() if q.exists() else ''; rule='''# Protected-surface non-regression rule — 2026-09-19\n\n- C7S3 is frozen authority. NEVER modify its data, CSS, DOM geometry, responsive behavior, artwork, rows, labels, details, Locker behavior, or Preview behavior unless explicitly requested.\n- C7S4 independently follows C7S3's visual grammar: one family header/hero followed by one single horizontal row of uniformly sized variant cells. Rows never wrap; excess columns scroll horizontally.\n- C7S4 column count is derived from current row data and may grow without a schema maximum.\n- Variant legend icons/labels remain locked to their corresponding vertical variant columns.\n- Release counts are QA snapshot expectations, never architectural limits.\n- New-season work is isolated behind season-specific state/selectors; do not mutate shared geometry to obtain a new-season layout.\n- Browser QA must compare C7S3 preview directly with live index.html before and after C7S4 round-trip at portrait and landscape. Any mismatch blocks publication.\n- If a requested change appears to require changing a protected surface, STOP and ask the owner.\n- Never claim QA that was not actually executed.\n\n'''; qt=re.sub(r'# Protected-surface non-regression rule — 2026-09-19.*?(?=\n# |\Z)','',qt,flags=re.S).lstrip(); q.write_text(rule+qt)
          PY
          npm init -y >/dev/null 2>&1; npm install playwright@1.55.0 >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > qa.js <<'JS'
          const {chromium}=require('playwright');const path=require('path');const url=f=>'file://'+path.join(process.cwd(),f);
          async function snap(page,season){await page.getByRole('button',{name:season,exact:true}).click();await page.waitForTimeout(400);return page.evaluate(()=>({legend:[...document.querySelectorAll('.variantLegend .legendItem')].filter(x=>x.offsetParent!==null).map(x=>{let b=x.getBoundingClientRect();return {t:x.textContent.trim(),cx:Math.round(b.x+b.width/2)}}),rows:[...document.querySelectorAll('.familyRow')].filter(r=>r.offsetParent!==null).map(r=>({text:r.querySelector('.familyName')?.textContent.trim(),rect:[r.getBoundingClientRect().x,r.getBoundingClientRect().y,r.getBoundingClientRect().width,r.getBoundingClientRect().height].map(Math.round),kids:[...r.children].map(x=>{let b=x.getBoundingClientRect();return [Math.round(b.x),Math.round(b.y),Math.round(b.width),Math.round(b.height),Math.round(b.x+b.width/2),getComputedStyle(x).gridRowStart]}),hero:r.querySelector('.familyHero img')?[r.querySelector('.familyHero img').getBoundingClientRect().width,r.querySelector('.familyHero img').getBoundingClientRect().height].map(Math.round):null,imgs:[...r.querySelectorAll('.spriteCell img')].map(x=>[Math.round(x.getBoundingClientRect().width),Math.round(x.getBoundingClientRect().height)])}))}));}
          (async()=>{const b=await chromium.launch({headless:true});for(const c of [{n:'portrait',w:393,h:852},{n:'landscape',w:852,h:393}]){let live=await b.newPage({viewport:{width:c.w,height:c.h}}),pre=await b.newPage({viewport:{width:c.w,height:c.h}});await live.goto(url('index.html'));await pre.goto(url('v2.0.28-preview.html'));await live.waitForTimeout(400);await pre.waitForTimeout(400);let authority=await snap(live,'C7S3'),initial=await snap(pre,'C7S3');if(JSON.stringify(authority)!==JSON.stringify(initial))throw Error(c.n+' C7S3 differs from LIVE before roundtrip');let c4=await snap(pre,'C7S4');let returned=await snap(pre,'C7S3');if(JSON.stringify(authority)!==JSON.stringify(returned))throw Error(c.n+' C7S3 differs from LIVE after C7S4 roundtrip');c4=await snap(pre,'C7S4');for(let [i,r] of c4.rows.entries()){let ys=r.kids.map(x=>x[1]);if(Math.max(...ys)-Math.min(...ys)>2)throw Error(c.n+' C7S4 wrapped row '+i+' y='+ys);if(r.kids.some(x=>x[5]!=='1'))throw Error(c.n+' C7S4 grid-row failure '+i);if(r.hero&&r.hero.join()!='86,86')throw Error(c.n+' hero size '+i+' '+r.hero);if(r.imgs.some(x=>x.join()!='74,74'))throw Error(c.n+' variant size '+i);let cells=r.kids.slice(1);for(let j=1;j<cells.length;j++){if(cells[j][0]-cells[j-1][0]!==88)throw Error(c.n+' column spacing row '+i+' '+j)}}await pre.screenshot({path:'qa-v2028-'+c.n+'.png',fullPage:true});console.log('PASS',c.n,'C7S3 frozen exact; C7S4 single-line uniform dynamic rows');await live.close();await pre.close()}await b.close()})();
          JS
          node qa.js
          rm -rf node_modules package.json package-lock.json qa.js
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          s=Path('v2.0.28-preview.html').read_text(); rec=[json.loads(x) for x in re.findall(r'\{[^{}]*"id"\s*:\s*\d+[^{}]*\}',s) if '"variantKey"' in x and '"image"' in x]; c=[r for r in rec if r.get('season')=='C7S4']; assert len(c)==101,len(c)
          for r in c: assert not str(r.get('image','')).startswith(('http://','https://','//')),r.get('name'); assert Path(r['image']).is_file(),r.get('name')
          new=[r for r in c if r.get('variantKey')=='Bounty' or r.get('family') in ('Morgana','Birthday','Crash Bandicoot','Blinky','Pond')]
          for r in new: assert r.get('releaseState')=='released',r.get('name'); assert str(r.get('effect','')).strip(),('missing effect',r.get('name'))
          assert len({r['image'] for r in c if r.get('variantKey')=='Bounty'})==20
          print('PASS current-release snapshot/data/details/local-assets',len(c))
          PY
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v2.0.28-preview.html QA.md qa-v2028-portrait.png qa-v2028-landscape.png
          git commit -m 'preview: C7S4 single-line dynamic rows; C7S3 frozen'
          git push origin HEAD:main
