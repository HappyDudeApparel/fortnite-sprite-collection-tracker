name: Fix v2.0.28 C7S4 row flow
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-v2028-preview-v2.yml']
permissions: {contents: write}
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v2.0.28-preview.html'); s=p.read_text()
          old='''<style id="v2028-c7s4">:root{--bounty:#ff4fc8}.v-Bounty{color:var(--bounty)}body[data-season="C7S4"] .variantLegend,body[data-season="C7S4"] .familyRow{grid-template-columns:minmax(230px,320px) repeat(5,minmax(62px,1fr))}@media(max-width:760px){body[data-season="C7S4"] .variantLegend,body[data-season="C7S4"] .familyRow{grid-template-columns:minmax(132px,1.45fr) repeat(5,minmax(46px,.72fr));padding-left:8px;padding-right:8px}body[data-season="C7S4"] .legendItem{font-size:10px;gap:4px}body[data-season="C7S4"] .dot{width:10px;height:10px}body[data-season="C7S4"] .familyHero{grid-template-columns:58px minmax(0,1fr);gap:8px}body[data-season="C7S4"] .familyHero img{width:56px;height:56px}body[data-season="C7S4"] .spriteCell{width:min(64px,13vw)}}</style>'''
          new='''<style id="v2028-c7s4">:root{--bounty:#ff4fc8}.v-Bounty{color:var(--bounty)}body[data-season="C7S4"] .variantTable{overflow-x:auto;overflow-y:clip;-webkit-overflow-scrolling:touch}body[data-season="C7S4"] .variantLegend,body[data-season="C7S4"] .familyRow{grid-template-columns:minmax(230px,320px) repeat(5,minmax(88px,1fr));min-width:790px}body[data-season="C7S4"] .variantLegend{width:max(100%,790px)}body[data-season="C7S4"] .familyRow{width:max(100%,790px)}@media(max-width:760px){body[data-season="C7S4"] .variantLegend,body[data-season="C7S4"] .familyRow{grid-template-columns:210px repeat(5,88px);min-width:650px;padding-left:14px;padding-right:14px}body[data-season="C7S4"] .familyHero{grid-template-columns:90px 1fr;gap:18px}body[data-season="C7S4"] .familyHero img{width:86px;height:86px}body[data-season="C7S4"] .spriteCell{width:88px;height:92px}body[data-season="C7S4"] .spriteCell img{width:74px;height:74px}body[data-season="C7S4"] .legendItem{font-size:13px;gap:6px}body[data-season="C7S4"] .dot{width:12px;height:12px}}</style>'''
          assert old in s, 'expected old C7S4 override not found'
          s=s.replace(old,new)
          p.write_text(s)
          q=p.read_text()
          assert 'grid-template-columns:210px repeat(5,88px)' in q
          assert 'body[data-season="C7S4"] .familyHero img{width:86px;height:86px}' in q
          assert 'body[data-season="C7S4"] .spriteCell img{width:74px;height:74px}' in q
          assert 'min-width:650px' in q and 'overflow-x:auto' in q
          print('QA PASS: C7S4 now preserves C7S3 row geometry and horizontally scrolls overflow')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v2.0.28-preview.html
          git commit -m 'preview: align C7S4 row geometry with C7S3'
          git push origin HEAD:main
