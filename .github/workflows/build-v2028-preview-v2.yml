name: Fix and browser-QA v2.0.28 C7S4 rows
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-v2028-preview-v2.yml']
permissions: {contents: write}
jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('v2.0.28-preview.html');s=p.read_text();s=re.sub(r'<style id="v2028-c7s4">.*?</style>','',s,flags=re.S);s=re.sub(r'<script id="v2028-season-hook">.*?</script>','',s,flags=re.S)
          css='''<style id="v2028-c7s4">:root{--bounty:#ff4fc8}.v-Bounty{color:var(--bounty)}body.season-c7s4 .variantTable{overflow-x:auto!important;overflow-y:hidden!important;-webkit-overflow-scrolling:touch}</style>'''
          hook='''<script id="v2028-season-hook">(()=>{let busy=false;function sync(){if(busy)return;busy=true;const active=[...document.querySelectorAll('.tab.active')].find(x=>/C7S[34]/.test(x.textContent)),on=!!active&&active.textContent.trim()==='C7S4';document.body.classList.toggle('season-c7s4',on);if(on){const portrait=innerWidth<900,cols=portrait?'230px repeat(5,88px)':'minmax(230px,320px) repeat(5,minmax(88px,1fr))';document.querySelectorAll('.variantLegend,.familyRow').forEach(el=>{el.style.setProperty('grid-template-columns',cols,'important');el.style.setProperty('min-width',portrait?'698px':'790px','important');el.style.setProperty('width',portrait?'698px':'100%','important')});document.querySelectorAll('.familyHero').forEach(el=>{el.style.setProperty('grid-template-columns','90px 1fr','important');el.style.setProperty('gap','18px','important')});document.querySelectorAll('.familyHero img').forEach(el=>{el.style.setProperty('width','86px','important');el.style.setProperty('height','86px','important')});document.querySelectorAll('.spriteCell').forEach(el=>{el.style.setProperty('width','88px','important');el.style.setProperty('height','92px','important')});document.querySelectorAll('.spriteCell img').forEach(el=>{el.style.setProperty('width','74px','important');el.style.setProperty('height','74px','important')})}busy=false}document.addEventListener('click',()=>setTimeout(sync,0),true);addEventListener('resize',sync);new MutationObserver(()=>setTimeout(sync,0)).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',sync);else sync();})();</script>'''
          s=s.replace('</body>',css+hook+'</body>',1);p.write_text(s)
          PY
          npm init -y >/dev/null 2>&1; npm install playwright@1.55.0 >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > qa.js <<'JS'
          const {chromium}=require('playwright');(async()=>{const browser=await chromium.launch({headless:true});for(const cfg of [{name:'portrait',w:393,h:852},{name:'landscape',w:852,h:393}]){const page=await browser.newPage({viewport:{width:cfg.w,height:cfg.h}});await page.goto('file://'+process.cwd()+'/v2.0.28-preview.html');await page.waitForTimeout(400);await page.getByRole('button',{name:'C7S4',exact:true}).click();await page.waitForTimeout(350);const audit=await page.evaluate(()=>({rows:[...document.querySelectorAll('.familyRow')].filter(r=>r.offsetParent!==null).slice(0,15).map(r=>{const b=[...r.children].map(x=>x.getBoundingClientRect());return {n:b.length,h:Math.round(r.getBoundingClientRect().height),cy:b.map(x=>Math.round(x.top+x.height/2)),left:b.map(x=>Math.round(x.left)),grid:getComputedStyle(r).gridTemplateColumns}})}));for(const [i,r] of audit.rows.entries()){if(r.n!==6)throw Error(cfg.name+' children '+i+' '+r.n);if(Math.max(...r.cy)-Math.min(...r.cy)>8)throw Error(cfg.name+' WRAP '+i+' '+JSON.stringify(r));if(r.h>125)throw Error(cfg.name+' HEIGHT '+i+' '+r.h);for(let j=1;j<r.left.length;j++)if(r.left[j]<=r.left[j-1])throw Error(cfg.name+' ORDER '+i+' '+JSON.stringify(r));}await page.screenshot({path:'qa-'+cfg.name+'.png',fullPage:true});console.log('PASS '+cfg.name,JSON.stringify(audit.rows.slice(0,2)));await page.close();}await browser.close();})();
          JS
          node qa.js
          rm -f qa.js package.json package-lock.json;rm -rf node_modules
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v2.0.28-preview.html qa-portrait.png qa-landscape.png;git commit -m 'preview: browser-verified C7S4 single-line rows';git push origin HEAD:main
