name: Isolate and browser-QA v2.0.28 without C7S3 regression
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-v2028-preview-v2.yml']
permissions: {contents: write}
jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('v2.0.28-preview.html'); s=p.read_text()
          s=re.sub(r'<style id="v2028-c7s4">.*?</style>','',s,flags=re.S)
          s=re.sub(r'<script id="v2028-season-hook">.*?</script>','',s,flags=re.S)
          # C7S4-only layout. Column count is dynamic; nothing here targets C7S3.
          css='''<style id="v2028-c7s4">:root{--bounty:#ff4fc8}.v-Bounty{color:var(--bounty)}body.season-c7s4 .variantTable{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}body.season-c7s4 .variantLegend,body.season-c7s4 .familyRow{grid-template-columns:320px repeat(var(--c7s4-cols),minmax(88px,1fr));min-width:calc(320px + var(--c7s4-cols)*88px)}body.season-c7s4 .variantLegend{width:max(100%,calc(320px + var(--c7s4-cols)*88px))}body.season-c7s4 .familyRow{width:max(100%,calc(320px + var(--c7s4-cols)*88px));align-items:center}body.season-c7s4 .familyHero{align-self:stretch;display:grid;grid-template-columns:86px minmax(0,1fr);gap:18px;align-items:center}body.season-c7s4 .familyHero img{width:86px;height:86px}body.season-c7s4 .spriteCell{width:88px;height:100%;min-height:104px;display:flex;flex-direction:column;justify-content:center;align-items:center}body.season-c7s4 .spriteCell img{width:74px;height:74px}@media(max-width:760px){body.season-c7s4 .variantLegend,body.season-c7s4 .familyRow{grid-template-columns:230px repeat(var(--c7s4-cols),88px);min-width:calc(230px + var(--c7s4-cols)*88px);width:calc(230px + var(--c7s4-cols)*88px)}body.season-c7s4 .familyHero{grid-template-columns:86px 126px;gap:18px}}</style>'''
          # Only season state + dynamic C7S4 column count. No shared inline geometry mutations.
          hook='''<script id="v2028-season-hook">(()=>{function sync(){const a=[...document.querySelectorAll('.tab.active')].find(x=>/C7S[34]/.test(x.textContent));const on=!!a&&a.textContent.trim()==='C7S4';document.body.classList.toggle('season-c7s4',on);if(on){const n=[...document.querySelectorAll('.variantLegend .legendItem')].filter(x=>x.offsetParent!==null).length;document.body.style.setProperty('--c7s4-cols',String(n))}else document.body.style.removeProperty('--c7s4-cols')}document.addEventListener('click',()=>setTimeout(sync,0),true);new MutationObserver(()=>setTimeout(sync,0)).observe(document.documentElement,{subtree:true,attributes:true,attributeFilter:['class']});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',sync);else sync()})();</script>'''
          s=s.replace('</body>',css+hook+'</body>',1); p.write_text(s)
          q=Path('QA.md'); qt=q.read_text() if q.exists() else ''
          rule='''# Protected-surface non-regression rule — 2026-09-19\n\n- C7S3 is a frozen authority. NEVER modify C7S3 data, CSS, DOM geometry, responsive behavior, artwork, rows, labels, details, Locker behavior, or Preview behavior unless the owner explicitly requests a C7S3 change.\n- C7S3 supplies the page's row/column visual grammar only; C7S4 implements that grammar independently and may grow to any number of variant columns.\n- Variant legend icons/labels must remain vertically aligned to their variant columns across every horizontal family row.\n- Counts such as 101 total C7S4 records or 20 Bounty assets are release-snapshot assertions only, never schema maxima or future architectural limits.\n- New-season work must be isolated behind season-specific state/selectors. Shared selectors may not be mutated to obtain a new-season layout.\n- Never use persistent inline geometry mutations on shared C7S3/C7S4 elements.\n- Every candidate changing C7S4 must browser-test C7S3 directly against current live index.html at portrait and landscape sizes, including C7S3 -> C7S4 -> C7S3 round-trip. Any geometry/content mismatch blocks publication.\n- Existing working behavior is protected by default. If a requested change appears to require changing a protected surface, STOP and ask the owner before proceeding.\n- A QA claim may be made only for checks actually executed. Source-string assertions alone are not visual/browser QA.\n\n'''
          # replace old protected block if present
          qt=re.sub(r'# Protected-surface non-regression rule — 2026-09-19.*?(?=\n# |\Z)', '', qt, flags=re.S).lstrip()
          q.write_text(rule+qt)
          PY
          npm init -y >/dev/null 2>&1; npm install playwright@1.55.0 >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > qa.js <<'JS'
          const {chromium}=require('playwright');const path=require('path');const url=f=>'file://'+path.join(process.cwd(),f);
          async function snap(page,season){await page.getByRole('button',{name:season,exact:true}).click();await page.waitForTimeout(350);return await page.evaluate(()=>({legend:[...document.querySelectorAll('.variantLegend .legendItem')].filter(x=>x.offsetParent!==null).map(x=>{let b=x.getBoundingClientRect();return {t:x.textContent.trim(),cx:Math.round(b.x+b.width/2)}}),rows:[...document.querySelectorAll('.familyRow')].filter(r=>r.offsetParent!==null).map(r=>({text:r.querySelector('.familyName')?.textContent.trim(),rect:[r.getBoundingClientRect().x,r.getBoundingClientRect().y,r.getBoundingClientRect().width,r.getBoundingClientRect().height].map(Math.round),kids:[...r.children].map(x=>{let b=x.getBoundingClientRect();return [Math.round(b.x),Math.round(b.y),Math.round(b.width),Math.round(b.height),Math.round(b.x+b.width/2)]}),hero:r.querySelector('.familyHero img')?[r.querySelector('.familyHero img').getBoundingClientRect().width,r.querySelector('.familyHero img').getBoundingClientRect().height].map(Math.round):null,imgs:[...r.querySelectorAll('.spriteCell img')].map(x=>[Math.round(x.getBoundingClientRect().width),Math.round(x.getBoundingClientRect().height)])}))}));}
          (async()=>{const b=await chromium.launch({headless:true});for(const c of [{n:'portrait',w:393,h:852},{n:'landscape',w:852,h:393}]){let live=await b.newPage({viewport:{width:c.w,height:c.h}}),pre=await b.newPage({viewport:{width:c.w,height:c.h}});await live.goto(url('index.html'));await pre.goto(url('v2.0.28-preview.html'));await live.waitForTimeout(350);await pre.waitForTimeout(350);let authority=await snap(live,'C7S3');let initial=await snap(pre,'C7S3');if(JSON.stringify(authority)!==JSON.stringify(initial))throw Error(c.n+' C7S3 differs from LIVE before roundtrip');let c4=await snap(pre,'C7S4');let returned=await snap(pre,'C7S3');if(JSON.stringify(authority)!==JSON.stringify(returned))throw Error(c.n+' C7S3 differs from LIVE after C7S4 roundtrip');c4=await snap(pre,'C7S4');let cols=c4.legend.length;if(cols<1)throw Error('no C7S4 legend');for(let [i,r] of c4.rows.entries()){if(r.kids.length!==cols+1)throw Error(c.n+' row '+i+' expected '+(cols+1)+' children got '+r.kids.length);let cy=r.kids.map(x=>x[1]+x[3]/2);if(Math.max(...cy)-Math.min(...cy)>8)throw Error(c.n+' C7S4 vertical misalignment row '+i+' '+cy);if(r.hero&&r.hero.join()!= '86,86')throw Error(c.n+' hero size '+i+' '+r.hero);if(r.imgs.some(x=>x.join()!='74,74'))throw Error(c.n+' variant size '+i);for(let j=0;j<cols;j++){let dx=Math.abs(c4.legend[j].cx-r.kids[j+1][4]);if(dx>8)throw Error(c.n+' legend/column drift row '+i+' col '+j+' dx='+dx)}}await pre.screenshot({path:'qa-v2028-'+c.n+'.png',fullPage:true});console.log('PASS',c.n,'C7S3 frozen exact; C7S4',cols,'dynamic aligned columns');await live.close();await pre.close()}await b.close()})();
          JS
          node qa.js
          rm -rf node_modules package.json package-lock.json qa.js
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          s=Path('v2.0.28-preview.html').read_text(); rec=[json.loads(x) for x in re.findall(r'\{[^{}]*"id"\s*:\s*\d+[^{}]*\}',s) if '"variantKey"' in x and '"image"' in x]; c=[r for r in rec if r.get('season')=='C7S4']
          # Snapshot expectations for THIS release only. These are not architectural maxima.
          assert len(c)==101,len(c)
          for r in c:
            assert not str(r.get('image','')).startswith(('http://','https://','//')),r.get('name'); assert Path(r['image']).is_file(),r.get('name')
          new=[r for r in c if r.get('variantKey')=='Bounty' or r.get('family') in ('Morgana','Birthday','Crash Bandicoot','Blinky','Pond')]
          for r in new: assert r.get('releaseState')=='released',r.get('name'); assert str(r.get('effect','')).strip(),('missing effect',r.get('name'))
          assert len({r['image'] for r in c if r.get('variantKey')=='Bounty'})==20
          print('PASS current-release snapshot/data/details/local-assets',len(c))
          PY
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v2.0.28-preview.html QA.md qa-v2028-portrait.png qa-v2028-landscape.png
          git commit -m 'preview: dynamic C7S4 columns with frozen C7S3 gate'
          git push origin HEAD:main
