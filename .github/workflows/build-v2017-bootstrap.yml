name: Bootstrap v2.0.17 isolated build
on:
  pull_request:
    branches:
      - main
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-v2-0-17-temp-20260821
      - run: |
          grep -q "const APP_VERSION='2.0.17'" index.html
          grep -q '"version": "2.0.17"' version.json
          grep -q "const APP_VERSION = '2.0.17'" service-worker.js
          if grep -Rni --include='index.html' --include='404.html' --include='service-worker.js' --include='version.json' 'fortnite.gg' .; then exit 1; fi
          mkdir -p dist
          zip -9 -j dist/Sprite-Collection-Locker-v2.0.17-GitHub-overwrite.zip index.html 404.html service-worker.js version.json
      - uses: actions/upload-artifact@v4
        with:
          name: v2017-qa-bundle
          path: |
            dist/Sprite-Collection-Locker-v2.0.17-GitHub-overwrite.zip
            index.html
            404.html
            service-worker.js
            version.json
            qa-baseline-v2016.html
