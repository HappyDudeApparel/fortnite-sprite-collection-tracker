name: C7S5 sprite source HTML probe
on:
  push:
    branches: [feature/c7s5-canonical-image-import-2026-11-01]
    paths: [.github/workflows/c7s5-source-probe.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python - <<'PY'
          import urllib.request,re,html
          for url in [
            "https://fortnite.gg/img/x/sprites/icons/T_Icon_BR_Creature_Sprite_PeelyBones_L.webp",
            "https://images.weserv.nl/?url=fortnite.gg%2Fimg%2Fx%2Fsprites%2Ficons%2FT_Icon_BR_Creature_Sprite_PeelyBones_L.webp",
            "https://wsrv.nl/?url=fortnite.gg%2Fimg%2Fx%2Fsprites%2Ficons%2FT_Icon_BR_Creature_Sprite_PeelyBones_L.webp",
            "https://r.jina.ai/https://fortnite.gg/sprites/280-halfpeel%27d",
            "https://www.fnsprites.info/",
            "https://beebom.com/fortnite-treasure-hunters-mini-season-sprites-guide/"
           ]:
           try:
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html'})
            with urllib.request.urlopen(req,timeout=25) as x: s=x.read().decode('utf-8',errors='replace')
            print('SOURCE',url,'LENGTH',len(s))
            print('ICON MATCHES',list(dict.fromkeys(re.findall(r'[^"\\s<>]+sprites/icons/[^"\\s<>]+',s)))[:12])
            for m in re.finditer('PeelyBones|halfpeel|Sweet Dreams|T_Icon_BR_Creature',s,re.I):
             print('SNIP',html.unescape(s[max(0,m.start()-170):m.end()+200])[:420])
             if m.start()>15000: break
           except Exception as e: print('ERROR',url,type(e).__name__,str(e))
          PY