name: C7S5 sprite source HTML probe
on:
  push:
    branches: [feature/c7s5-canonical-image-import-2026-11-01]
    paths: [.github/workflows/c7s5-source-probe.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python - <<'PY'
          import urllib.request,re,html
          url='https://r.jina.ai/https://fortnite.gg/sprites'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          try:
           with urllib.request.urlopen(req,timeout=45) as resp: s=resp.read(3000000).decode('utf-8','replace')
           print('TEXT SIZE',len(s))
           p=re.compile(r'\[!\[Image\s*\d*:\s*([^\]]+)\]\((https://fortnite\.gg/img/x/sprites/icons/[^)]+\.webp)\)\]\((https://fortnite\.gg/sprites/[^)]+)\)')
           a=p.findall(s);print('MATCHES',len(a)); print('FIRST',a[:40])
           print('SWEET',[(x,y,z) for x,y,z in a if 'Sweet Dreams' in x])
           if not a:print('EXCERPT',s[s.index('Halfpeel'):s.index('Halfpeel')+1100] if 'Halfpeel' in s else s[:1800])
          except Exception as e: print('ERROR',type(e).__name__,str(e))
          PY