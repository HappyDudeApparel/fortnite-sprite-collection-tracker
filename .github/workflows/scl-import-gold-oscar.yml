name: One-time authentic Gold and Sir Oscar portraits
on:
  push:
    branches:
      - update/c7s5-nov16-seven-sprites
    paths:
      - .github/workflows/scl-import-gold-oscar.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download 17 exact Fortnite.GG source portraits
        run: |
          set -euo pipefail
          mkdir -p assets/sprites/c7s5
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --max-time 60 -A "Mozilla/5.0 (compatible; SpriteCollectionLocker/2.0.63)" "https://fortnite.gg/img/x/sprites/icons/T_Icon_BR_Creature_Sprite_PeelyBones_LiquidGold_L.webp" -o "assets/sprites/c7s5/halfpeel-d-gold.webp"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --max-time 60 -A "Mozilla/5.0 (compatible; SpriteCollectionLocker/2.0.63)" "https://fortnite.gg/img/x/sprites/icons/T_Icon_BR_Creature_Sprite_Parrot_LiquidGold_L.webp" -o "assets/sprites/c7s5/re-pete-gold.webp"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --max-time 60 -A "Mozilla/5.0 (compatible; SpriteCollectionLocker/2.0.63)" "https://fortnite.gg/img/x/sprites/icons/T_Icon_BR_Creature_Sprite_BarrelOfFish_LiquidGold_L.webp" -o "assets/sprites/c7s5/barry-o-fish-gold.webp"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --max-time 60 -A "Mozilla/5.0 (compatible; SpriteCollectionLocker/2.0.63)" "https://fortnite.gg/img/x/sprites/icons/T_Icon_BR_Creature_Sprite_Compass_LiquidGold_L.webp" -o "assets/sprites/c7s5/wayfinder-gold.webp"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --max-time 60 -A "Mozilla/5.0 (compatible; SpriteCollectionLocker/2.0.63)" "https://fortnite.gg/img/x/sprites/icons/T_Icon_BR_Creature_Sprite_TreasureChest_LiquidGold_L.webp" -o "assets/sprites/c7s5/chester-gold.webp"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --max-time 60 -A "Mozilla/5.0 (compatible; SpriteCollectionLocker/2.0.63)" "https://fortnite.gg/img/x/sprites/icons/T_Icon_BR_Creature_Sprite_UnbotheredFish_LiquidGold_L.webp" -o "assets/sprites/c7s5/kelper-gold.webp"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --max-time 60 -A "Mozilla/5.0 (compatible; SpriteCollectionLocker/2.0.63)" "https://fortnite.gg/img/x/sprites/icons/T_Icon_BR_Creature_Sprite_TreasureMap_LiquidGold_L.webp" -o "assets/sprites/c7s5/exmarks-gold.webp"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --max-time 60 -A "Mozilla/5.0 (compatible; SpriteCollectionLocker/2.0.63)" "https://fortnite.gg/img/x/sprites/icons/T_Icon_BR_Creature_Sprite_Squibbly_LiquidGold_ui_v1_1_Alpha_L.webp" -o "assets/sprites/c7s5/lil-squibbly-gold.webp"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --max-time 60 -A "Mozilla/5.0 (compatible; SpriteCollectionLocker/2.0.63)" "https://fortnite.gg/img/x/sprites/icons/T_Icon_BR_Creature_Sprite_PirateCalamari_LiquidGold_L.webp" -o "assets/sprites/c7s5/squiplash-gold.webp"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --max-time 60 -A "Mozilla/5.0 (compatible; SpriteCollectionLocker/2.0.63)" "https://fortnite.gg/img/x/sprites/icons/T_Icon_BR_Creature_Sprite_PlaymakerBrewery_LiquidGold_L.webp" -o "assets/sprites/c7s5/lil-flacko-gold.webp"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --max-time 60 -A "Mozilla/5.0 (compatible; SpriteCollectionLocker/2.0.63)" "https://fortnite.gg/img/x/sprites/icons/T_Icon_BR_Creature_Sprite_RookGecko_LiquidGold_L.webp" -o "assets/sprites/c7s5/lil-uzi-vert-jr-gold.webp"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --max-time 60 -A "Mozilla/5.0 (compatible; SpriteCollectionLocker/2.0.63)" "https://fortnite.gg/img/x/sprites/icons/T_Icon_BR_Creature_Sprite_CoinPile_LiquidGold_L.webp" -o "assets/sprites/c7s5/plundarrgh-gold.webp"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --max-time 60 -A "Mozilla/5.0 (compatible; SpriteCollectionLocker/2.0.63)" "https://fortnite.gg/img/x/sprites/icons/T_Icon_BR_Creature_Sprite_LushlyZest_LiquidGold_ui_v1_1_Alpha_L.webp" -o "assets/sprites/c7s5/mini-miku-gold.webp"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --max-time 60 -A "Mozilla/5.0 (compatible; SpriteCollectionLocker/2.0.63)" "https://fortnite.gg/img/x/sprites/icons/T_Icon_BR_Creature_Sprite_WhiteTiger_LiquidGold_L.webp" -o "assets/sprites/c7s5/sir-oscar-the-second-gold.webp"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --max-time 60 -A "Mozilla/5.0 (compatible; SpriteCollectionLocker/2.0.63)" "https://fortnite.gg/img/x/sprites/icons/T_Icon_BR_Creature_Sprite_WhiteTiger_L.webp" -o "assets/sprites/c7s5/sir-oscar-the-second-base.webp"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --max-time 60 -A "Mozilla/5.0 (compatible; SpriteCollectionLocker/2.0.63)" "https://fortnite.gg/img/x/sprites/icons/T_Icon_BR_Creature_Sprite_WhiteTiger_Jeweled_L.webp" -o "assets/sprites/c7s5/sir-oscar-the-second-fortune.webp"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --max-time 60 -A "Mozilla/5.0 (compatible; SpriteCollectionLocker/2.0.63)" "https://fortnite.gg/img/x/sprites/icons/T_Icon_BR_Creature_Sprite_WhiteTiger_Cursed_L.webp" -o "assets/sprites/c7s5/sir-oscar-the-second-cursed.webp"
      - name: Verify all authentic WebP files and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = ["halfpeel-d-gold.webp","re-pete-gold.webp","barry-o-fish-gold.webp","wayfinder-gold.webp","chester-gold.webp","kelper-gold.webp","exmarks-gold.webp","lil-squibbly-gold.webp","squiplash-gold.webp","lil-flacko-gold.webp","lil-uzi-vert-jr-gold.webp","plundarrgh-gold.webp","mini-miku-gold.webp","sir-oscar-the-second-gold.webp","sir-oscar-the-second-base.webp","sir-oscar-the-second-fortune.webp","sir-oscar-the-second-cursed.webp"]
          for name in files:
              path = Path("assets/sprites/c7s5") / name
              data = path.read_bytes()
              assert len(data)>5000, f"Unexpectedly small: {path} {len(data)}"
              assert data[:4]==b"RIFF" and data[8:12]==b"WEBP", f"Not WebP: {path}"
              print(f"PASS {path} ({len(data)} bytes)")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sprites/c7s5/*-gold.webp assets/sprites/c7s5/sir-oscar-the-second-*.webp
          git commit -m "Import 17 authentic Gold and Sir Oscar source portraits"
          git push
