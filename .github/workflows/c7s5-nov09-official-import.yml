name: "C7S5 November 9 official portrait import"
on:
  push:
    branches: ["fix/c7s5-2026-11-09-catalogue"]
    paths: [".github/workflows/c7s5-nov09-official-import.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install image verifier
        run: python -m pip install --quiet pillow requests beautifulsoup4
      - name: Fetch actual artwork and update ONLY four official C7S5 image mappings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import requests, json, hashlib, io, re, time
          from bs4 import BeautifulSoup
          repo=Path('.')
          html_path=repo/'index.html'
          html=html_path.read_text(encoding='utf-8')
          start=html.index('const SPRITES=')+len('const SPRITES=')
          stop=html.index('];',start)+1
          rows=json.loads(html[start:stop])
          assert len(rows)==316
          archive=json.dumps([x for x in rows if x['season']!='C7S5'],ensure_ascii=False)
          tasks=[
            (534,'Lil\' Uzi Vert Jr.','Base',308,'lil-uzi-vert-jr-base.webp'),
            (535,'Lil\' Uzi Vert Jr.','Fortune',310,'lil-uzi-vert-jr-fortune.webp'),
            (536,'Lil\' Uzi Vert Jr.','Cursed',309,'lil-uzi-vert-jr-cursed.webp'),
            (537,'Transponder Snail','Base',314,'transponder-snail-base.webp'),
          ]
          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0 Safari/537.36','Accept':'image/avif,image/webp,image/*,*/*;q=0.8'})
          report=[]
          for id,family,variant,detail_id,filename in tasks:
            sprite=next(x for x in rows if x['id']==id)
            assert (sprite['family'],sprite['variantKey'])==(family,variant)
            url=sprite['image']
            assert url.startswith('https://fortnite.gg/img/x/sprites/icons/T_Icon_') and url.endswith('.webp'),url
            expected=sprite['artworkSourcePage']
            assert '/sprites/'+str(detail_id)+'-' in expected,expected
            # Inspect the authentic individual Fortnite.GG page to confirm icon filename.
            page=session.get(expected,timeout=35)
            page.raise_for_status()
            soup=BeautifulSoup(page.text,'html.parser')
            icon_name=url.split('/')[-1]
            if icon_name not in page.text:
              icons=sorted(set(re.findall(r'T_Icon_[a-zA-Z0-9_]+\\.webp',page.text)))
              raise ValueError(f'Icon not located in authenticated source for {sprite["name"]}: expected {icon_name}; page candidates={icons[:20]}')
            payload=None
            for attempt in range(3):
              try:
                response=session.get(url,headers={'Referer':expected},timeout=40)
                response.raise_for_status()
                payload=response.content
                pic=Image.open(io.BytesIO(payload))
                pic.load()
                assert pic.size==(512,512),f'{sprite["name"]}: actual dimensions {pic.size}'
                assert pic.format=='WEBP',f'{sprite["name"]}: not WebP'
                assert ('A' in pic.getbands() or 'transparency' in pic.info),f'{sprite["name"]}: missing alpha'
                assert len(payload)>2500 and len(payload)<2_000_000
                break
              except Exception as exc:
                if attempt==2: raise
                print('Retry image',sprite['name'],type(exc).__name__,str(exc),flush=True)
                time.sleep(attempt+1)
            target='assets/sprites/c7s5/'+filename
            p=repo/target
            p.parent.mkdir(parents=True,exist_ok=True)
            p.write_bytes(payload)
            sprite['image']=target
            sprite['artworkStatus']='source-verified-and-local-binary-validated'
            sha=hashlib.sha256(payload).hexdigest()
            report.append({'id':id,'name':sprite['name'],'sourcePage':expected,'source':url,'target':target,'bytes':len(payload),'dimensions':[512,512],'sha256':sha,'hasAlpha':True})
            print('IMPORTED',sprite['name'],target,len(payload),sha,flush=True)
          html=html[:start]+json.dumps(rows,ensure_ascii=False,separators=(',',':'))+html[stop:]
          html_path.write_text(html,encoding='utf-8')
          assert json.dumps([x for x in rows if x['season']!='C7S5'],ensure_ascii=False)==archive
          assert len(rows)==316 and len(set(x['id'] for x in rows))==316
          season=[x for x in rows if x['season']=='C7S5']
          assert len(season)==35 and sum(x['releaseState']=='released' and x.get('countsTowardCollection',True) and not x.get('preview',False) for x in season)==34
          assert all((repo/x['image']).is_file() for x in season)
          am=repo/'asset-manifest.json'
          assets=json.loads(am.read_text())
          assert assets['version']=='2.0.55'
          for item in report:
            if item['target'] not in assets['assets']:assets['assets'].append(item['target'])
          am.write_text(json.dumps(assets,indent=2)+'\\n')
          manifest=repo/'docs/C7S5-NOV-09-OFFICIAL-NEW-IMAGES.json'
          manifest.write_text(json.dumps({'fetched':'2026-11-09','source':'Fortnite.GG original individual 512px WebP portrait assets','newImages':report},indent=2)+'\\n')
          print('PASS: all four exact official images downloaded; 35 shown, 34 obtainable, archived rows untouched',flush=True)
          PY
      - name: Validate app inline script syntax and newly local portraits
        run: |
          python - <<'PY'
          import json,pathlib,subprocess,re,tempfile
          html=pathlib.Path('index.html').read_text()
          a=html.index('const SPRITES=')+len('const SPRITES=')
          b=html.index('];',a)+1
          rows=json.loads(html[a:b])
          assert len(rows)==316
          for id in (534,535,536,537):
            sprite=next(s for s in rows if s['id']==id)
            assert sprite['image'].startswith('assets/sprites/c7s5/') and pathlib.Path(sprite['image']).is_file()
          for code in re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>',html):
            if not code.strip(): continue
            with tempfile.NamedTemporaryFile(mode='w',suffix='.js') as tmp:
              tmp.write(code);tmp.flush()
              subprocess.run(['node','--check',tmp.name],check=True)
          print('PASS: all inline JavaScript parses and newly-localized portraits exist')
          PY
      - name: Commit authenticated artwork on review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html asset-manifest.json docs/C7S5-NOV-09-OFFICIAL-NEW-IMAGES.json assets/sprites/c7s5/lil-uzi-vert-jr-base.webp assets/sprites/c7s5/lil-uzi-vert-jr-fortune.webp assets/sprites/c7s5/lil-uzi-vert-jr-cursed.webp assets/sprites/c7s5/transponder-snail-base.webp
          git diff --cached --stat
          git commit -m "C7S5 v2.0.55: store four authenticated 512px Fortnite.GG portraits locally"
          git push origin "HEAD:fix/c7s5-2026-11-09-catalogue"
