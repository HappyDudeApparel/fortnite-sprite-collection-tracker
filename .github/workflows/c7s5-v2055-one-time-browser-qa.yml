name: "One-time C7S5 v2.0.55 browser smoke QA"
on:
  push:
    branches: ["fix/c7s5-2026-11-09-catalogue"]
    paths: [".github/workflows/c7s5-v2055-one-time-browser-qa.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install Chromium browser tests
        run: |
          pip install -q playwright pillow
          playwright install --with-deps chromium
      - name: Verify assets and all three isolated season datasets
        run: |
          python - <<'PY'
          import pathlib,re,json,hashlib
          from PIL import Image
          html=pathlib.Path('index.html').read_text()
          a=html.index('const SPRITES=')+len('const SPRITES=')
          b=html.index('];',a)+1
          r=json.loads(html[a:b])
          assert len(r)==316 and len({x['id'] for x in r})==316
          assert [(s,sum(x['season']==s for x in r)) for s in ('C7S3','C7S4','C7S5')]==[('C7S3',119),('C7S4',162),('C7S5',35)]
          assert len([x for x in r if x['season']=='C7S5' and x['releaseState']=='released' and x.get('countsTowardCollection',True) and not x['preview']])==34
          assert [x['id'] for x in r if x['season']=='C7S5' and x['preview']]==[527]
          assert len({x['family'] for x in r if x['season']=='C7S5'})==13
          assert not any(x['id'] in (532,533) for x in r)
          manifest=json.loads(pathlib.Path('docs/C7S5-NOV-09-OFFICIAL-NEW-IMAGES.json').read_text())
          am=json.loads(pathlib.Path('asset-manifest.json').read_text())
          assert am['version']=='2.0.55'
          for entry in manifest['newImages']:
            img=pathlib.Path(entry['target'])
            assert img.exists() and img.stat().st_size==entry['bytes']
            assert hashlib.sha256(img.read_bytes()).hexdigest()==entry['sha256']
            with Image.open(img) as im: assert im.size==(512,512) and 'A' in im.getbands()
            assert entry['target'] in am['assets']
          for x in r:
            if x['season']=='C7S5': assert pathlib.Path(x['image']).is_file(),x['name']
          print('PASS: 316 internal, 314 legitimate, 313 collectible including 34 C7S5, all 35 local C7S5 images')
          PY
      - name: Chromium visual, transitions, local storage, export, archive regression
        run: |
          python - <<'PY'
          import threading,http.server,json
          from playwright.sync_api import sync_playwright
          server=http.server.ThreadingHTTPServer(('127.0.0.1',8767),http.server.SimpleHTTPRequestHandler)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          with sync_playwright() as engine:
            browser=engine.chromium.launch(args=['--no-sandbox'])
            for width,height in [(390,844),(768,1024),(1440,900)]:
              page=browser.new_page(viewport={'width':width,'height':height})
              errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              page.goto('http://127.0.0.1:8767/index.html',wait_until='domcontentloaded',timeout=60000)
              page.wait_for_selector('#familyRows .familyRow',timeout=30000)
              assert page.evaluate('currentSeason')=='C7S5'
              assert page.locator('#familyRows .familyRow').count()==13
              assert page.locator('#mainLegend .legendItem').count()==4
              assert page.locator('#summary .sumNum').first.inner_text()=='34'
              assert page.locator('.familyRow[data-family="Lil\' Uzi Vert Jr."] .spriteCell').count()==3
              assert page.locator('.familyRow[data-family="Transponder Snail"] .spriteCell').count()==1
              kelper=page.locator('.familyRow[data-family="Kelper"] .spriteCell[data-variant="Cursed"]')
              assert kelper.count()==1
              assert kelper.get_attribute('data-open-small')=='527'
              assert 'UNRELEASED' in kelper.inner_text()
              pics=page.evaluate("""async () => {
                let ids=[534,535,536,537,527], result=[];
                for(let id of ids) {
                  let s=SPRITES.find(x=>x.id===id), img=new Image();img.src=s.image;
                  await img.decode();
                  result.push({id,width:img.naturalWidth,height:img.naturalHeight,path:s.image});
                }
                return result;
              }""")
              assert len(pics)==5 and all(x['width']==512 and x['height']==512 for x in pics),pics
              # Explicitly test the new four local sprites in the real image-rendering canvas.
              for sprite_id in (534,535,536,537):
                png_length=page.evaluate("""async id => {
                  const canvas=await featuredCardSnapshot(id,true,0);
                  return canvas.toDataURL('image/png').length;
                }""",sprite_id)
                assert png_length>20000,(sprite_id,png_length)
              # Normal ownership and saved Level 5 must persist across season switching.
              base=page.locator('.familyRow[data-family="Lil\' Uzi Vert Jr."] [data-small="534"]')
              base.click()
              assert page.locator('#summary .sumTile[data-mode="found"] .sumNum').inner_text()=='1'
              page.locator('button[data-season="C7S3"]').click()
              assert page.evaluate('currentSeason')=='C7S3'
              assert page.locator('#summary .sumNum').first.inner_text()=='117'
              page.locator('button[data-season="C7S4"]').click()
              assert page.evaluate('currentSeason')=='C7S4'
              assert page.locator('#summary .sumNum').first.inner_text()=='162'
              page.locator('button[data-season="C7S5"]').click()
              assert page.locator('#summary .sumTile[data-mode="found"] .sumNum').inner_text()=='1'
              assert page.evaluate('favorites.has(534)') is True
              assert page.evaluate('favorites.has(527)') is False
              # Default preview asset remains visible, but not collectible.
              page.locator('.familyRow[data-family="Kelper"] [data-open-small="527"]').click()
              assert page.evaluate('favorites.has(527)') is False
              snapshot=page.evaluate("({selectedId,activeTab, detail:document.getElementById('detailBadges').textContent,inline:document.getElementById('inlineDetailBadges').textContent,collectible:isCollectible(byId(527))})")
              print('PREVIEW DEBUG',snapshot,flush=True)
              assert snapshot['selectedId']==527 and snapshot['collectible'] is False,snapshot
              assert 'Unreleased' in (snapshot['detail']+' '+snapshot['inline']),snapshot
              page.locator('button[data-tab="locker"]').click()
              assert page.locator('#lockerBaseGrid [data-locker-family="Lil\' Uzi Vert Jr."]').count()==1
              assert page.locator('#lockerBaseGrid [data-locker-family="Transponder Snail"]').count()==1
              assert not errors,errors
              page.screenshot(path=f'c7s5-v2055-{width}.png',full_page=False)
              print('PASS viewport',width,height,'five authentic portraits, four exported PNG canvases, 13 rows, owned state and archives',flush=True)
              page.close()
            browser.close()
          server.shutdown()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c7s5-v2055-browser-smoke
          path: c7s5-v2055-*.png
          if-no-files-found: ignore
