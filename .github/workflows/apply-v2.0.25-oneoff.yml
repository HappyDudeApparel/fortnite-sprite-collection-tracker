name: Apply Sprite Locker v2.0.25

on:
  push:
    paths:
      - '.github/workflows/apply-v2.0.25-oneoff.yml'

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply surgical production update
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          VERSION = '2.0.25'
          HACKER_ANNOUNCED_IDS = [237,238,239,240,241,242,243,244,246,247,248,252,256,260]
          CROWN_HACKER_ID = 245

          def patch_html(path):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              original = text

              # Build/version labels.
              text = text.replace('Sprite Collection Locker — v2.0.24', f'Sprite Collection Locker — v{VERSION}')
              text = text.replace("const APP_VERSION='2.0.18'", f"const APP_VERSION='{VERSION}'")
              text = text.replace("const APP_VERSION='2.0.24'", f"const APP_VERSION='{VERSION}'")

              # Remove ONLY the custom C7S3 Legacy row from the main collection renderer.
              # Dash/Superman records, legacy detail/preview code, and Locker code remain untouched.
              start_marker = " const legacySprites=[SPRITES.find(s=>s.name==='Dash Sprite'),SPRITES.find(s=>s.name==='Superman Sprite')].filter(Boolean);"
              end_marker = " document.getElementById('familyRows').innerHTML="
              if start_marker not in text:
                  raise SystemExit(f'{path}: custom legacy-row start marker not found')
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              text = text[:start] + text[end:]

              # Officially announced Sept. 10 Loot Hacker entries: catalogue remains visible/countable,
              # but releaseState now records announcement status until live acquisition is verified.
              for sid in HACKER_ANNOUNCED_IDS:
                  pat = re.compile(r'(\{"id":%d,.*?"variantKey":"Hacker".*?"releaseState":)"catalogued"' % sid)
                  text, n = pat.subn(r'\1"announced-2026-09-10"', text, count=1)
                  if n != 1:
                      raise SystemExit(f'{path}: expected Hacker releaseState for id {sid} not found exactly once')

              # Loot Hacker Crown was independently verified live in the prior audit.
              pat = re.compile(r'(\{"id":%d,.*?"variantKey":"Hacker".*?"releaseState":)"catalogued"' % CROWN_HACKER_ID)
              text, n = pat.subn(r'\1"released"', text, count=1)
              if n != 1:
                  raise SystemExit(f'{path}: Loot Hacker Crown releaseState not found exactly once')

              # Guardrails: permanent catalogue count/data and legacy data must remain present.
              for needle in ['"id":127,"family":"Dash"','"id":128,"family":"Superman"','"id":249,"family":"Mega Man"']:
                  if needle not in text:
                      raise SystemExit(f'{path}: preservation guard failed for {needle}')
              if 'legacyPairRow' in text and start_marker in text:
                  raise SystemExit(f'{path}: legacy row render block still present')

              if text == original:
                  raise SystemExit(f'{path}: no changes produced')
              p.write_text(text, encoding='utf-8')

          for html in ['index.html','404.html']:
              patch_html(html)

          vpath = Path('version.json')
          v = json.loads(vpath.read_text(encoding='utf-8'))
          v.update({
              'version': VERSION,
              'published': '2026-09-10',
              'notes': 'Loot Hacker release-status update: Crown verified live; 14 remaining finished variants marked officially announced for Sept. 10. Removed the custom C7S3 Legacy row from the main collection only; Dash/Superman remain in Locker and featured preview.'
          })
          vpath.write_text(json.dumps(v, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          sw = Path('service-worker.js')
          s = sw.read_text(encoding='utf-8')
          s2, n = re.subn(r"const APP_VERSION = '[^']+';", f"const APP_VERSION = '{VERSION}';", s, count=1)
          if n != 1:
              raise SystemExit('service-worker.js: APP_VERSION not found exactly once')
          sw.write_text(s2, encoding='utf-8')

          ch = Path('CHANGELOG.md')
          if ch.exists():
              old = ch.read_text(encoding='utf-8')
              entry = "## 2.0.25 — 2026-09-10\n- Marked Loot Hacker Crown as verified released/live.\n- Marked the other 14 finished Loot Hacker variants as officially announced for Sept. 10 pending live acquisition verification.\n- Removed the custom Legacy row from the C7S3 main collection view only. Dash and Superman remain available in Locker and featured preview/detail modes.\n- Preserved C7S4 permanent catalogue totals and Mega Man Base-only treatment.\n\n"
              if '## 2.0.25 — 2026-09-10' not in old:
                  ch.write_text(entry + old, encoding='utf-8')

          # Self-remove the one-off workflow from the resulting production commit.
          Path('.github/workflows/apply-v2.0.25-oneoff.yml').unlink(missing_ok=True)
          PY

          git config user.name 'Sprite Locker Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html 404.html version.json service-worker.js CHANGELOG.md .github/workflows/apply-v2.0.25-oneoff.yml
          git diff --cached --check
          git commit -m 'release: Sprite Collection Locker v2.0.25'
          git push origin HEAD:main
