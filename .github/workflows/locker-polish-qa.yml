name: Locker v2.0.57 ornate mobile polish QA
on:
  push:
    branches: [fix/locker-concept-fidelity-mobile-v2057]
    paths:
      - index.html
      - scripts/qa_locker_vault.py
      - assets/ui/locker-vault-polish.css
      - 'assets/ui/locker-art/**'
      - asset-manifest.json
      - '.github/workflows/locker-polish-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Protect canonical records and app outside Locker
        run: |
          git fetch --quiet origin main --depth=1
          python - <<'PY'
          import subprocess, pathlib, json, re
          base=subprocess.check_output(['git','show','FETCH_HEAD:index.html'],text=True)
          current=pathlib.Path('index.html').read_text()
          def a(s,k):
              x=s.index('const '+k+'=')+len('const '+k+'=')
              return json.loads(s[x:s.index('];',x)+1])
          for k in ['SPRITES','BACKGROUNDS']:
              assert a(base,k)==a(current,k),k
          assert len(a(current,'SPRITES'))==316 and len(a(current,'BACKGROUNDS'))==58
          stripped=re.sub(r'^.*locker-vault-polish.css.*\n','',current,flags=re.M)
          assert stripped==base, 'Original site markup changed outside additive polish stylesheet link'
          assert all(x in json.loads(pathlib.Path('asset-manifest.json').read_text())['assets'] for x in ['assets/ui/locker-vault-polish.css','assets/ui/locker-art/locker-gallery-border-polish.svg','assets/ui/locker-art/locker-gallery-plinth-approved.webp'])
          print('PASS: all 316 Sprite rows and 58 backgrounds byte-identical; entire base markup preserved')
          PY
      - run: |
          pip install --quiet pillow playwright
          playwright install --with-deps chromium
      - name: Browser and visual screenshots at 7 widths plus persistence/export
        run: python scripts/qa_locker_vault.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locker-v2057-mobile-large-ornate-screenshots
          path: qa-screenshots/
          retention-days: 7
          if-no-files-found: ignore
