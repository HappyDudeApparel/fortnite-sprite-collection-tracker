name: Locker v2.0.60 list/grid state and ornament regression
on:
  push:
    branches: [fix/locker-list-state-ornament-v2060]
    paths:
      - index.html
      - scripts/qa_locker_vault.py
      - assets/ui/locker-vault.js
      - assets/ui/locker-vault-polish.css
      - 'assets/ui/locker-art/**'
      - asset-manifest.json
      - version.json
      - service-worker.js
      - '.github/workflows/locker-polish-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Protect canonical records and app outside Locker
        run: |
          git fetch --quiet origin main --depth=1
          python - <<'PY'
          import subprocess, pathlib, json, re
          base=subprocess.check_output(['git','show','FETCH_HEAD:index.html'],text=True)
          current=pathlib.Path('index.html').read_text()
          def a(s,k):
              x=s.index('const '+k+'=')+len('const '+k+'=')
              return json.loads(s[x:s.index('];',x)+1])
          for k in ['SPRITES','BACKGROUNDS']:
              assert a(base,k)==a(current,k),k
          assert len(a(current,'SPRITES'))==316 and len(a(current,'BACKGROUNDS'))==58
          normalized=current.replace('Sprite Collection Locker — v2.0.60</title>','Sprite Collection Locker — v2.0.59</title>').replace("const APP_VERSION='2.0.60'","const APP_VERSION='2.0.59'").replace('locker-vault-polish.css?v=2.0.60','locker-vault-polish.css?v=2.0.59').replace('locker-vault.js?v=2.0.60','locker-vault.js?v=2.0.59')
          assert normalized==base, 'Original site markup changed outside additive Locker stylesheet and intended version bump'
          versions=(json.loads(pathlib.Path('version.json').read_text())['version'],json.loads(pathlib.Path('asset-manifest.json').read_text())['version'],re.search(r"const APP_VERSION = '([^']+)'",pathlib.Path('service-worker.js').read_text()).group(1),re.search(r"const APP_VERSION='([^']+)'",current).group(1))
          assert versions==('2.0.60',)*4, versions
          assert all(x in json.loads(pathlib.Path('asset-manifest.json').read_text())['assets'] for x in ['assets/ui/locker-vault-polish.css','assets/ui/locker-art/locker-gallery-border-polish.svg','assets/ui/locker-art/locker-gallery-plinth-approved.webp'])
          print('PASS: all 316 Sprite rows and 58 backgrounds byte-identical; entire base markup preserved')
          PY
      - run: |
          pip install --quiet pillow playwright
          playwright install --with-deps chromium
      - name: Browser and visual screenshots at 7 widths plus persistence/export
        run: python scripts/qa_locker_vault.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locker-v2060-mode-regression-and-approved-screenshots
          path: qa-screenshots/
          retention-days: 7
          if-no-files-found: ignore
