name: Build v2.0.17 temporary
on:
  workflow_dispatch:
  push:
    branches:
      - build-v2-0-17-temp-20260821
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python build_v2017.py
      - uses: actions/upload-artifact@v4
        with:
          name: v2017-package
          path: dist/Sprite-Collection-Locker-v2.0.17-GitHub-overwrite.zip
      - uses: actions/upload-artifact@v4
        with:
          name: v2017-built-files
          path: |
            index.html
            404.html
            service-worker.js
            version.json
            qa-baseline-v2016.html
